<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker><style>.b{fill:#fff;stroke:#111;stroke-width:2;rx:14}.t{font-family:'Times New Roman',serif;font-size:29px;font-weight:bold;text-anchor:middle}.x{font-family:'Times New Roman',serif;font-size:23px;text-anchor:middle}.s{font-family:'Times New Roman',serif;font-size:20px;text-anchor:middle}.l{stroke:#111;stroke-width:2.2;fill:none;marker-end:url(#a)}.d{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:8 7}</style></defs><rect width="1600" height="980" fill="#fff"/><text x="800" y="52" class="t">Alur Preprocessing Frekuensi-Angular AF2</text>
<rect x="55" y="135" width="190" height="90" class="b"/><text x="150" y="188" class="x">Input RGB</text>
<rect x="300" y="120" width="230" height="120" class="b"/><text x="415" y="165" class="x">Overlapping</text><text x="415" y="198" class="x">patches</text><text x="415" y="226" class="s">m=32, o=0.50</text>
<rect x="590" y="120" width="230" height="120" class="b"/><text x="705" y="170" class="x">FFT2 + shift</text><text x="705" y="205" class="s">per RGB channel</text>
<rect x="880" y="120" width="230" height="120" class="b"/><text x="995" y="160" class="x">Amplitude</text><text x="995" y="193" class="x">+ phase</text><text x="995" y="222" class="s">phase retained</text>
<rect x="1170" y="120" width="300" height="120" class="b"/><text x="1320" y="160" class="x">Angular density</text><text x="1320" y="195" class="s">Dᵢᶜ(k)</text><text x="1320" y="224" class="s">K=360 bins</text>
<path d="M245 180L300 180" class="l"/><path d="M530 180L590 180" class="l"/><path d="M820 180L880 180" class="l"/><path d="M1110 180L1170 180" class="l"/>
<rect x="1170" y="355" width="300" height="130" class="b"/><text x="1320" y="397" class="x">Entropy-adaptive</text><text x="1320" y="430" class="x">threshold</text><text x="1320" y="465" class="s">τ=γ/(1+exp(-H))</text>
<rect x="830" y="355" width="280" height="130" class="b"/><text x="970" y="397" class="x">Directional</text><text x="970" y="430" class="x">weighting</text><text x="970" y="464" class="s">low density suppressed</text>
<rect x="490" y="355" width="280" height="130" class="b"/><text x="630" y="397" class="x">Weighted complex</text><text x="630" y="430" class="x">spectrum</text><text x="630" y="464" class="s">F̃=F·w</text>
<rect x="150" y="355" width="280" height="130" class="b"/><text x="290" y="405" class="x">Inverse FFT</text><text x="290" y="442" class="s">spatial cue</text>
<path d="M1320 240L1320 355" class="l"/><path d="M1170 420L1110 420" class="l"/><path d="M830 420L770 420" class="l"/><path d="M490 420L430 420" class="l"/>
<rect x="150" y="635" width="300" height="120" class="b"/><text x="300" y="680" class="x">Fold + overlap</text><text x="300" y="715" class="x">averaging</text><text x="300" y="744" class="s">R_AF2(I)</text>
<rect x="560" y="635" width="300" height="120" class="b"/><text x="710" y="680" class="x">Min-max</text><text x="710" y="715" class="x">normalization</text><text x="710" y="744" class="s">G(I)</text>
<rect x="970" y="635" width="330" height="120" class="b"/><text x="1135" y="680" class="x">Residual image gate</text><text x="1135" y="718" class="s">I′ = I + I ⊙ G(I)</text>
<rect x="1370" y="635" width="180" height="120" class="b"/><text x="1460" y="705" class="x">Output I′</text>
