<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2.2;rx:14;ry:14}
      .title{font-family:'Times New Roman',serif;font-size:30px;font-weight:bold;text-anchor:middle}
      .txt{font-family:'Times New Roman',serif;font-size:25px;text-anchor:middle}
      .small{font-family:'Times New Roman',serif;font-size:22px;text-anchor:middle}
      .arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#555;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1500" fill="#fff"/>
  <text x="600" y="55" class="title">Kerangka Penelitian</text>

  <rect x="250" y="95" width="700" height="100" class="box"/>
  <text x="600" y="138" class="txt">Kajian literatur dan identifikasi masalah</text>
  <text x="600" y="172" class="small">fine-grained coffee-defect discrimination</text>

  <rect x="250" y="245" width="700" height="100" class="box"/>
  <text x="600" y="287" class="txt">Dataset Faruq-v3 grouped</text>
  <text x="600" y="321" class="small">audit parent/hash leakage • 21 kelas</text>

  <rect x="250" y="395" width="700" height="100" class="box"/>
  <text x="600" y="437" class="txt">AF2 reference</text>
  <text x="600" y="471" class="small">patch-wise Fourier + angular amplitude suppression</text>

  <rect x="250" y="545" width="700" height="120" class="box"/>
  <text x="600" y="586" class="txt">Factorized structural analysis</text>
  <text x="600" y="620" class="small">AF2WIN • AF2ORI • AF2POL • AF2SOFT • AF2LUM</text>
  <text x="600" y="650" class="small">one factor at a time</text>

  <rect x="250" y="715" width="700" height="105" class="box"/>
  <text x="600" y="757" class="txt">Limited parameter sensitivity</text>
  <text x="600" y="791" class="small">prioritas: γ dan patch size jika diperlukan</text>

  <rect x="250" y="870" width="700" height="100" class="box"/>
  <text x="600" y="912" class="txt">AF2* selection dan METHOD FREEZE</text>
  <text x="600" y="946" class="small">locked test tidak digunakan untuk selection</text>

  <rect x="80" y="1020" width="470" height="125" class="box"/>
  <text x="315" y="1060" class="txt">Native arm</text>
  <text x="315" y="1095" class="small">RGB → YOLO26n</text>
  <text x="315" y="1128" class="small">official yolo26n.pt</text>

  <rect x="650" y="1020" width="470" height="125" class="box"/>
  <text x="885" y="1060" class="txt">Treatment arm</text>
  <text x="885" y="1095" class="small">RGB → AF2* → YOLO26n</text>
  <text x="885" y="1128" class="small">matched initialization</text>

  <rect x="250" y="1215" width="700" height="125" class="box"/>
  <text x="600" y="1255" class="txt">Evaluasi dan analisis</text>
  <text x="600" y="1290" class="small">aggregate • lower-tail • mechanism</text>
  <text x="600" y="1323" class="small">visualization/error • efficiency</text>

  <rect x="250" y="1390" width="700" height="75" class="box"/>
  <text x="600" y="1438" class="txt">Kesimpulan penelitian</text>

  <path d="M600 195 L600 245" class="arrow"/>
  <path d="M600 345 L600 395" class="arrow"/>
  <path d="M600 495 L600 545" class="arrow"/>
  <path d="M600 665 L600 715" class="arrow"/>
  <path d="M600 820 L600 870" class="arrow"/>
  <path d="M600 970 L315 1020" class="arrow"/>
  <path d="M600 970 L885 1020" class="arrow"/>
  <path d="M315 1145 L500 1215" class="arrow"/>
  <path d="M885 1145 L700 1215" class="arrow"/>
  <path d="M600 1340 L600 1390" class="arrow"/>
</svg>
