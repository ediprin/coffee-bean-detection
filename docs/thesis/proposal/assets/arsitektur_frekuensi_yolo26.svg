<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .panel { font-family:'Times New Roman',serif; font-size:25px; font-weight:700; fill:#111; }
      .label { font-family:'Times New Roman',serif; font-size:22px; font-weight:700; fill:#111; text-anchor:middle; }
      .small { font-family:'Times New Roman',serif; font-size:19px; fill:#222; text-anchor:middle; }
      .tiny { font-family:'Times New Roman',serif; font-size:17px; fill:#333; text-anchor:middle; }
      .note { font-family:'Times New Roman',serif; font-size:18px; font-style:italic; fill:#333; text-anchor:middle; }
      .box { fill:#fff; stroke:#405564; stroke-width:2.1; rx:10; ry:10; }
      .blue { fill:#edf5fb; stroke:#315d7a; stroke-width:2.2; rx:10; ry:10; }
      .green { fill:#eef7ef; stroke:#4e7a55; stroke-width:2.2; rx:10; ry:10; }
      .gold { fill:#fff7e7; stroke:#a87921; stroke-width:2.2; rx:10; ry:10; }
      .group { fill:#fafbfc; stroke:#7b858c; stroke-width:1.8; rx:12; ry:12; stroke-dasharray:7 5; }
      .arrow { stroke:#2b2b2b; stroke-width:2.1; fill:none; marker-end:url(#arrow); }
      .thin { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="900" fill="#fff"/>

  <text class="panel" x="28" y="35">(a) Arsitektur keseluruhan</text>
  <rect class="box" x="28" y="72" width="130" height="92"/>
  <text class="label" x="93" y="111">Citra RGB</text>
  <text class="small" x="93" y="140">tensor masukan</text>
  <line class="arrow" x1="158" y1="118" x2="184" y2="118"/>

  <rect class="blue" x="190" y="66" width="205" height="104"/>
  <text class="label" x="292" y="103">Prapemrosesan</text>
  <text class="label" x="292" y="130">frekuensi-angular</text>
  <text class="small" x="292" y="154">P_FA(I)</text>
  <line class="arrow" x1="395" y1="118" x2="420" y2="118"/>

  <rect class="box" x="426" y="72" width="112" height="92"/>
  <text class="label" x="482" y="111">Citra hasil</text>
  <text class="small" x="482" y="140">I'</text>
  <line class="arrow" x1="538" y1="118" x2="564" y2="118"/>

  <rect class="group" x="570" y="55" width="292" height="126"/>
  <text class="small" x="716" y="80" style="font-weight:700">YOLO26n — arsitektur tetap</text>
  <rect class="green" x="592" y="96" width="80" height="58"/>
  <rect class="green" x="687" y="96" width="64" height="58"/>
  <rect class="green" x="766" y="96" width="75" height="58"/>
  <text class="tiny" x="632" y="132">Backbone</text>
  <text class="tiny" x="719" y="132">Neck</text>
  <text class="tiny" x="803" y="120">Detection</text>
  <text class="tiny" x="803" y="142">Head</text>
  <line class="thin" x1="672" y1="125" x2="687" y2="125"/>
  <line class="thin" x1="751" y1="125" x2="766" y2="125"/>
  <line class="arrow" x1="862" y1="118" x2="884" y2="118"/>

  <rect class="gold" x="890" y="72" width="82" height="92"/>
  <text class="tiny" x="931" y="102">Bounding</text>
  <text class="tiny" x="931" y="123">box + kelas</text>
  <text class="tiny" x="931" y="144">cacat</text>

  <text class="note" x="500" y="214">Frontend frekuensi-angular bekerja pada ruang masukan; backbone, neck, dan detection head YOLO26n tidak dimodifikasi.</text>
  <line x1="28" y1="245" x2="972" y2="245" stroke="#aaa" stroke-width="1.4"/>

  <text class="panel" x="28" y="282">(b) Detail frontend frekuensi-angular</text>

  <rect class="group" x="28" y="310" width="292" height="440"/>
  <text class="small" x="174" y="340" style="font-weight:700">Analisis spektral lokal</text>
  <rect class="box" x="60" y="365" width="228" height="66"/>
  <text class="small" x="174" y="392">Patch lokal</text>
  <text class="tiny" x="174" y="416">m=32, tumpang tindih 50%</text>
  <line class="arrow" x1="174" y1="431" x2="174" y2="458"/>
  <rect class="blue" x="83" y="466" width="182" height="62"/>
  <text class="small" x="174" y="493">FFT / DFT lokal</text>
  <text class="tiny" x="174" y="516">FFT shift</text>
  <line class="arrow" x1="174" y1="528" x2="174" y2="555"/>
  <rect class="box" x="72" y="563" width="204" height="62"/>
  <text class="small" x="174" y="590">Amplitudo A + fase φ</text>
  <text class="tiny" x="174" y="613">fase dipertahankan</text>
  <line class="arrow" x1="174" y1="625" x2="174" y2="652"/>
  <rect class="blue" x="55" y="660" width="238" height="66"/>
  <text class="small" x="174" y="687">Distribusi angular</text>
  <text class="tiny" x="174" y="711">atau radial-angular</text>

  <rect class="group" x="354" y="310" width="292" height="440"/>
  <text class="small" x="500" y="340" style="font-weight:700">Seleksi respons spektral</text>
  <rect class="gold" x="390" y="383" width="220" height="78"/>
  <text class="small" x="500" y="412">Densitas D, p, q</text>
  <text class="tiny" x="500" y="439">normalisasi per patch/pita</text>
  <line class="arrow" x1="500" y1="461" x2="500" y2="493"/>
  <rect class="gold" x="390" y="501" width="220" height="78"/>
  <text class="small" x="500" y="530">Entropi H</text>
  <text class="tiny" x="500" y="557">ambang adaptif τ</text>
  <line class="arrow" x1="500" y1="579" x2="500" y2="611"/>
  <rect class="gold" x="390" y="619" width="220" height="78"/>
  <text class="small" x="500" y="648">Pembobotan spektral w</text>
  <text class="tiny" x="500" y="675">hard / soft sesuai konfigurasi</text>
  <line class="arrow" x1="500" y1="697" x2="500" y2="721"/>
  <text class="tiny" x="500" y="740">Spektrum terbobot</text>

  <rect class="group" x="680" y="310" width="292" height="440"/>
  <text class="small" x="826" y="340" style="font-weight:700">Rekonstruksi dan residual</text>
  <rect class="blue" x="716" y="365" width="220" height="66"/>
  <text class="small" x="826" y="392">Inverse FFT</text>
  <text class="tiny" x="826" y="416">inverse shift + fase asli</text>
  <line class="arrow" x1="826" y1="431" x2="826" y2="458"/>
  <rect class="box" x="716" y="466" width="220" height="62"/>
  <text class="small" x="826" y="493">Rekonstruksi patch</text>
  <text class="tiny" x="826" y="516">overlap-add / perataan</text>
  <line class="arrow" x1="826" y1="528" x2="826" y2="555"/>
  <rect class="blue" x="716" y="563" width="220" height="62"/>
  <text class="small" x="826" y="590">Normalisasi gate G</text>
  <text class="tiny" x="826" y="613">rentang 0-1</text>
  <line class="arrow" x1="826" y1="625" x2="826" y2="652"/>
  <rect class="green" x="716" y="660" width="220" height="66"/>
  <text class="small" x="826" y="687">Residual fusion</text>
  <text class="tiny" x="826" y="711">I' = I + I × G</text>

  <path class="arrow" d="M293,693 H334 V422 H382"/>
  <path class="arrow" d="M610,658 H661 V398 H708"/>

  <rect x="78" y="785" width="844" height="82" rx="10" ry="10" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
  <text class="tiny" x="500" y="817">C0 = konfigurasi referensi AFAB-2 yang diadaptasi; C1–C5 = variasi desain yang diuji secara bertahap.</text>
  <text class="tiny" x="500" y="844">C* ditentukan dari data validasi sebelum pelatihan ulang seed konfirmasi dan evaluasi data uji.</text>
</svg>
