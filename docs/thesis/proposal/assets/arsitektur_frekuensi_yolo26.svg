<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 30px; font-weight: 700; fill: #111; }
      .panel { font-family: 'Times New Roman', serif; font-size: 26px; font-weight: 700; fill: #111; }
      .label { font-family: 'Times New Roman', serif; font-size: 24px; font-weight: 700; fill: #111; text-anchor: middle; }
      .small { font-family: 'Times New Roman', serif; font-size: 21px; fill: #222; text-anchor: middle; }
      .note { font-family: 'Times New Roman', serif; font-size: 20px; font-style: italic; fill: #333; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #2f4858; stroke-width: 2.4; rx: 13; ry: 13; }
      .box-blue { fill: #edf5fb; stroke: #315d7a; stroke-width: 2.5; rx: 13; ry: 13; }
      .box-green { fill: #eef7ef; stroke: #4e7a55; stroke-width: 2.5; rx: 13; ry: 13; }
      .box-gold { fill: #fff7e7; stroke: #a87921; stroke-width: 2.5; rx: 13; ry: 13; }
      .group { fill: #f8fafb; stroke: #77838c; stroke-width: 2.2; rx: 16; ry: 16; stroke-dasharray: 8 6; }
      .arrow { stroke: #2b2b2b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #5a5a5a; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1020" fill="#ffffff"/>
  <text class="title" x="800" y="46" text-anchor="middle">Arsitektur Integrasi Prapemrosesan Frekuensi-Angular dengan YOLO26n</text>

  <!-- Panel A -->
  <text class="panel" x="70" y="92">(a) Arsitektur keseluruhan</text>

  <rect class="box" x="80" y="125" width="230" height="120"/>
  <text class="label" x="195" y="173">Citra RGB</text>
  <text class="small" x="195" y="207">tensor masukan</text>

  <line class="arrow" x1="310" y1="185" x2="390" y2="185"/>

  <rect class="box-blue" x="400" y="120" width="330" height="130"/>
  <text class="label" x="565" y="169">Prapemrosesan</text>
  <text class="label" x="565" y="202">frekuensi-angular</text>
  <text class="small" x="565" y="232">P_FA(I)</text>

  <line class="arrow" x1="730" y1="185" x2="810" y2="185"/>

  <rect class="box" x="820" y="125" width="190" height="120"/>
  <text class="label" x="915" y="174">Citra hasil</text>
  <text class="small" x="915" y="208">I'</text>

  <line class="arrow" x1="1010" y1="185" x2="1080" y2="185"/>

  <rect class="group" x="1090" y="105" width="355" height="165"/>
  <text class="small" x="1268" y="132" style="font-weight:700">YOLO26n — arsitektur tetap</text>
  <rect class="box-green" x="1110" y="153" width="100" height="80"/>
  <rect class="box-green" x="1220" y="153" width="90" height="80"/>
  <rect class="box-green" x="1320" y="153" width="105" height="80"/>
  <text class="small" x="1160" y="198">Backbone</text>
  <text class="small" x="1265" y="198">Neck</text>
  <text class="small" x="1372" y="187">Detection</text>
  <text class="small" x="1372" y="212">Head</text>
  <line class="thin" x1="1210" y1="193" x2="1220" y2="193"/>
  <line class="thin" x1="1310" y1="193" x2="1320" y2="193"/>

  <line class="arrow" x1="1445" y1="185" x2="1510" y2="185"/>
  <rect class="box-gold" x="1515" y="125" width="0" height="120" opacity="0"/>
  <text class="small" x="1510" y="162" text-anchor="start">Bounding box</text>
  <text class="small" x="1510" y="190" text-anchor="start">+ kelas</text>
  <text class="small" x="1510" y="218" text-anchor="start">cacat</text>

  <text class="note" x="800" y="302">Prapemrosesan bekerja pada ruang masukan; backbone, neck, dan detection head YOLO26n tidak dimodifikasi.</text>

  <!-- Divider -->
  <line x1="65" y1="338" x2="1535" y2="338" stroke="#a7a7a7" stroke-width="1.8"/>

  <!-- Panel B -->
  <text class="panel" x="70" y="385">(b) Detail frontend frekuensi-angular</text>

  <!-- Stage groups -->
  <rect class="group" x="70" y="420" width="455" height="410"/>
  <text class="small" x="297" y="452" style="font-weight:700">Analisis spektral lokal</text>

  <rect class="box" x="105" y="480" width="180" height="84"/>
  <text class="small" x="195" y="512">Patch lokal</text>
  <text class="small" x="195" y="541">m=32, overlap 50%</text>

  <line class="arrow" x1="285" y1="522" x2="335" y2="522"/>

  <rect class="box-blue" x="345" y="480" width="145" height="84"/>
  <text class="small" x="418" y="512">FFT / DFT</text>
  <text class="small" x="418" y="541">lokal</text>

  <line class="arrow" x1="418" y1="564" x2="418" y2="611"/>

  <rect class="box" x="310" y="620" width="215" height="88"/>
  <text class="small" x="418" y="651">Amplitudo A</text>
  <text class="small" x="418" y="680">+ fase φ</text>

  <line class="arrow" x1="310" y1="664" x2="260" y2="664"/>

  <rect class="box-blue" x="95" y="620" width="155" height="88"/>
  <text class="small" x="172" y="649">Distribusi</text>
  <text class="small" x="172" y="677">angular / radial</text>

  <line class="arrow" x1="172" y1="708" x2="172" y2="756"/>
  <rect class="box" x="95" y="765" width="155" height="42"/>
  <text class="small" x="172" y="793">densitas D, p, q</text>

  <!-- Stage 2 -->
  <rect class="group" x="570" y="420" width="420" height="410"/>
  <text class="small" x="780" y="452" style="font-weight:700">Seleksi respons spektral</text>

  <rect class="box-gold" x="615" y="490" width="330" height="92"/>
  <text class="small" x="780" y="522">Entropi H</text>
  <text class="small" x="780" y="552">→ ambang adaptif τ</text>

  <line class="arrow" x1="780" y1="582" x2="780" y2="630"/>

  <rect class="box-gold" x="615" y="640" width="330" height="92"/>
  <text class="small" x="780" y="672">Pembobotan spektral w</text>
  <text class="small" x="780" y="702">hard / soft sesuai konfigurasi</text>

  <line class="arrow" x1="780" y1="732" x2="780" y2="770"/>

  <rect class="box" x="650" y="778" width="260" height="42"/>
  <text class="small" x="780" y="806">spektrum terbobot F̃</text>

  <!-- Stage 3 -->
  <rect class="group" x="1035" y="420" width="500" height="410"/>
  <text class="small" x="1285" y="452" style="font-weight:700">Rekonstruksi dan residual</text>

  <rect class="box-blue" x="1080" y="485" width="180" height="80"/>
  <text class="small" x="1170" y="518">IFFT</text>
  <text class="small" x="1170" y="545">fase dipertahankan</text>

  <line class="arrow" x1="1260" y1="525" x2="1310" y2="525"/>

  <rect class="box" x="1320" y="485" width="170" height="80"/>
  <text class="small" x="1405" y="517">Overlap-add</text>
  <text class="small" x="1405" y="545">rekonstruksi</text>

  <line class="arrow" x1="1405" y1="565" x2="1405" y2="615"/>

  <rect class="box-blue" x="1320" y="625" width="170" height="80"/>
  <text class="small" x="1405" y="658">Normalisasi</text>
  <text class="small" x="1405" y="686">gate G ∈ [0,1]</text>

  <line class="arrow" x1="1320" y1="665" x2="1265" y2="665"/>

  <rect class="box-green" x="1080" y="625" width="175" height="80"/>
  <text class="small" x="1168" y="655">Residual</text>
  <text class="small" x="1168" y="686">I' = I + I ⊙ G</text>

  <line class="arrow" x1="1168" y1="705" x2="1168" y2="758"/>

  <rect class="box" x="1080" y="768" width="175" height="42"/>
  <text class="small" x="1168" y="796">citra RGB hasil</text>

  <!-- Inter-stage arrows -->
  <line class="arrow" x1="525" y1="625" x2="570" y2="625"/>
  <line class="arrow" x1="990" y1="625" x2="1035" y2="625"/>

  <!-- Bottom note -->
  <rect x="145" y="875" width="1310" height="92" rx="12" ry="12" fill="#f7f7f7" stroke="#999" stroke-width="1.6"/>
  <text class="small" x="800" y="910">C0 = konfigurasi referensi AFAB-2 yang diadaptasi; C1–C5 = variasi desain yang diuji secara bertahap.</text>
  <text class="small" x="800" y="944">Konfigurasi C* ditentukan dari data validasi sebelum pengujian ulang multi-seed dan evaluasi data uji.</text>
</svg>
