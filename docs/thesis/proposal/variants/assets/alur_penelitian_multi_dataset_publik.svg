<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#252525"/>
    </marker>
    <style>
      .title { font-family:'Times New Roman',serif; font-size:25px; font-weight:700; fill:#111; text-anchor:middle; }
      .sub { font-family:'Times New Roman',serif; font-size:19px; fill:#222; text-anchor:middle; }
      .step { stroke-width:2.6; rx:18; ry:18; }
      .blue { fill:#dcecff; stroke:#245a9a; }
      .green { fill:#e1f2dc; stroke:#387532; }
      .gold { fill:#fff0bd; stroke:#b27a00; }
      .violet { fill:#eadff7; stroke:#7247a2; }
      .cyan { fill:#dff3f4; stroke:#1f7f83; }
      .orange { fill:#ffe2c7; stroke:#c96c00; }
      .rose { fill:#f9dce2; stroke:#c4485c; }
      .arrow { stroke:#252525; stroke-width:3; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1500" fill="#ffffff"/>

  <rect class="step blue" x="70" y="30" width="860" height="100"/>
  <text class="title" x="500" y="70">Persiapan robusta_SNI_Dataset</text>
  <text class="sub" x="500" y="102">dataset utama, 21 kelas</text>

  <line class="arrow" x1="500" y1="130" x2="500" y2="157"/>
  <rect class="step green" x="70" y="165" width="860" height="100"/>
  <text class="title" x="500" y="205">Pembagian data secara terkelompok</text>
  <text class="sub" x="500" y="237">train, validation, dan test</text>

  <line class="arrow" x1="500" y1="265" x2="500" y2="292"/>
  <rect class="step gold" x="70" y="300" width="860" height="100"/>
  <text class="title" x="500" y="340">Pembentukan baseline YOLO26n</text>
  <text class="sub" x="500" y="372">model acuan tanpa prapemrosesan tambahan</text>

  <line class="arrow" x1="500" y1="400" x2="500" y2="427"/>
  <rect class="step orange" x="70" y="435" width="860" height="105"/>
  <text class="title" x="500" y="476">Pengujian prapemrosesan frekuensi-angular</text>
  <text class="sub" x="500" y="508">variasi C0–C5 pada dataset utama</text>

  <line class="arrow" x1="500" y1="540" x2="500" y2="567"/>
  <rect class="step cyan" x="70" y="575" width="860" height="100"/>
  <text class="title" x="500" y="615">Pemilihan dan pembekuan C*</text>
  <text class="sub" x="500" y="647">konfigurasi final prapemrosesan</text>

  <line class="arrow" x1="500" y1="675" x2="500" y2="702"/>
  <rect class="step violet" x="70" y="710" width="860" height="110"/>
  <text class="title" x="500" y="750">Persiapan dataset konfirmasi</text>
  <text class="sub" x="500" y="783">Capstone, Lulus, dan Niacubilla</text>

  <line class="arrow" x1="500" y1="820" x2="500" y2="847"/>
  <rect class="step rose" x="70" y="855" width="860" height="115"/>
  <text class="title" x="500" y="897">Pelatihan terpisah pada setiap dataset konfirmasi</text>
  <text class="sub" x="500" y="930">baseline YOLO26n dibandingkan dengan C* + YOLO26n</text>

  <line class="arrow" x1="500" y1="970" x2="500" y2="997"/>
  <rect class="step green" x="70" y="1005" width="860" height="110"/>
  <text class="title" x="500" y="1047">Evaluasi akhir pada test set</text>
  <text class="sub" x="500" y="1080">dilakukan setelah protokol eksperimen dibekukan</text>

  <line class="arrow" x1="500" y1="1115" x2="500" y2="1142"/>
  <rect class="step blue" x="70" y="1150" width="860" height="110"/>
  <text class="title" x="500" y="1192">Analisis hasil</text>
  <text class="sub" x="500" y="1225">kinerja per dataset dan konsistensi lintas dataset</text>

  <line class="arrow" x1="500" y1="1260" x2="500" y2="1287"/>
  <rect class="step gold" x="70" y="1295" width="860" height="105"/>
  <text class="title" x="500" y="1337">Kesimpulan</text>
  <text class="sub" x="500" y="1370">pengaruh prapemrosesan frekuensi-angular terhadap YOLO26n</text>
</svg>
