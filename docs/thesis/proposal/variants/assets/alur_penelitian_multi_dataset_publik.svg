<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#252525"/>
    </marker>
    <style>
      .title { font-family:'Times New Roman',serif; font-size:26px; font-weight:700; fill:#111; text-anchor:middle; }
      .sub { font-family:'Times New Roman',serif; font-size:20px; fill:#222; text-anchor:middle; }
      .step { stroke-width:2.6; rx:18; ry:18; }
      .blue { fill:#dcecff; stroke:#245a9a; }
      .green { fill:#e1f2dc; stroke:#387532; }
      .gold { fill:#fff0bd; stroke:#b27a00; }
      .violet { fill:#eadff7; stroke:#7247a2; }
      .cyan { fill:#dff3f4; stroke:#1f7f83; }
      .orange { fill:#ffe2c7; stroke:#c96c00; }
      .rose { fill:#f9dce2; stroke:#c4485c; }
      .arrow { stroke:#252525; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .icon { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1500" fill="#ffffff"/>

  <rect class="step blue" x="70" y="35" width="860" height="100"/>
  <circle cx="125" cy="85" r="24" class="icon" stroke="#245a9a"/>
  <path d="M109 85h32 M125 69v32" class="icon" stroke="#245a9a"/>
  <text class="title" x="535" y="78">Candidate pool dataset publik</text>
  <text class="sub" x="535" y="108">dataset deteksi cacat biji kopi dari beberapa sumber</text>

  <line class="arrow" x1="500" y1="135" x2="500" y2="166"/>
  <rect class="step green" x="70" y="175" width="860" height="110"/>
  <rect x="105" y="205" width="42" height="50" rx="4" class="icon" stroke="#387532"/>
  <path d="M115 230l9 9 17-20" class="icon" stroke="#387532"/>
  <text class="title" x="535" y="218">Audit provenance, lisensi, versi, anotasi, dan duplikasi</text>
  <text class="sub" x="535" y="250">exact hash, near-duplicate, fork/derivatif, dan kualitas bounding box</text>

  <line class="arrow" x1="500" y1="285" x2="500" y2="316"/>
  <rect class="step gold" x="70" y="325" width="860" height="105"/>
  <path d="M104 390h48 M104 370h48 M104 350h48" class="icon" stroke="#b27a00"/>
  <circle cx="118" cy="350" r="5" fill="#b27a00"/><circle cx="138" cy="370" r="5" fill="#b27a00"/><circle cx="125" cy="390" r="5" fill="#b27a00"/>
  <text class="title" x="535" y="368">Pembekuan dataset independen dan split leakage-safe</text>
  <text class="sub" x="535" y="399">setiap dataset mempertahankan ruang kelasnya sendiri</text>

  <line class="arrow" x1="500" y1="430" x2="500" y2="461"/>
  <rect class="step violet" x="70" y="470" width="860" height="105"/>
  <circle cx="127" cy="521" r="27" class="icon" stroke="#7247a2"/>
  <path d="M127 494v54 M100 521h54" class="icon" stroke="#7247a2"/>
  <text class="title" x="535" y="513">Pemilihan dataset pengembangan Ddev</text>
  <text class="sub" x="535" y="544">berdasarkan kualitas data, bukan hasil model</text>

  <line class="arrow" x1="500" y1="575" x2="500" y2="606"/>
  <rect class="step blue" x="70" y="615" width="860" height="105"/>
  <path d="M106 668l20-28 20 28-20 28z" class="icon" stroke="#245a9a"/>
  <circle cx="126" cy="668" r="8" fill="#245a9a"/>
  <text class="title" x="535" y="657">Pembentukan model acuan YOLO26n pada Ddev</text>
  <text class="sub" x="535" y="688">baseline pengembangan menggunakan seed 42</text>

  <line class="arrow" x1="500" y1="720" x2="500" y2="751"/>
  <rect class="step cyan" x="70" y="760" width="860" height="105"/>
  <circle cx="126" cy="812" r="28" class="icon" stroke="#1f7f83"/>
  <circle cx="126" cy="812" r="13" class="icon" stroke="#1f7f83"/>
  <path d="M126 775v20 M126 829v20 M89 812h20 M143 812h20" class="icon" stroke="#1f7f83"/>
  <text class="title" x="535" y="802">Konfigurasi referensi frekuensi-angular C0</text>
  <text class="sub" x="535" y="833">frontend pada ruang citra masukan</text>

  <line class="arrow" x1="500" y1="865" x2="500" y2="896"/>
  <rect class="step orange" x="70" y="905" width="860" height="105"/>
  <path d="M102 940h50 M102 960h50 M102 980h50" class="icon" stroke="#c96c00"/>
  <circle cx="120" cy="940" r="6" fill="#c96c00"/><circle cx="138" cy="960" r="6" fill="#c96c00"/><circle cx="113" cy="980" r="6" fill="#c96c00"/>
  <text class="title" x="535" y="947">Pengujian variasi C0–C5 hanya pada Ddev</text>
  <text class="sub" x="535" y="978">termasuk analisis sensitivitas terbatas</text>

  <line class="arrow" x1="500" y1="1010" x2="500" y2="1041"/>
  <rect class="step cyan" x="70" y="1050" width="860" height="105"/>
  <path d="M106 1099l20-18 20 18-7 27h-26z" class="icon" stroke="#1f7f83"/>
  <path d="M126 1081v45" class="icon" stroke="#1f7f83"/>
  <text class="title" x="535" y="1092">Pemilihan dan pembekuan konfigurasi C*</text>
  <text class="sub" x="535" y="1123">C* tidak dituning ulang pada dataset eksternal</text>

  <line class="arrow" x1="500" y1="1155" x2="500" y2="1186"/>
  <rect class="step rose" x="70" y="1195" width="860" height="115"/>
  <path d="M100 1250a26 26 0 1 0 12-22" class="icon" stroke="#c4485c"/>
  <path d="M102 1226l14 1-5 13" class="icon" stroke="#c4485c"/>
  <text class="title" x="535" y="1238">Konfirmasi multi-dataset dengan beberapa seed</text>
  <text class="sub" x="535" y="1271">B0, B1, B2, dan B3 pada setiap dataset; C* tetap</text>

  <line class="arrow" x1="500" y1="1310" x2="500" y2="1341"/>
  <rect class="step blue" x="70" y="1350" width="860" height="105"/>
  <path d="M104 1415v-32 M124 1415v-48 M144 1415v-66" class="icon" stroke="#245a9a"/>
  <text class="title" x="535" y="1392">Evaluasi akhir dan analisis lintas dataset</text>
  <text class="sub" x="535" y="1423">mAP, paired delta, hard-class, kesalahan, visual, dan efisiensi</text>
</svg>
