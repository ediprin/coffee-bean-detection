name: One-time migrate proposal math delimiters

on:
  push:
    branches:
      - proposal/thesis-foundation
    paths:
      - ".github/workflows/_migrate-math-delimiters.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposal branch
        uses: actions/checkout@v4
        with:
          ref: proposal/thesis-foundation

      - name: Convert proposal math delimiters
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("docs/thesis/proposal/BAB_I_PENDAHULUAN.md"),
              Path("docs/thesis/proposal/BAB_II_TINJAUAN_PUSTAKA.md"),
              Path("docs/thesis/proposal/BAB_III_METODOLOGI_PENELITIAN.md"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")
              text = text.replace(r"\[", "$$").replace(r"\]", "$$")
              text = text.replace(r"\(", "$").replace(r"\)", "$")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit migration
        run: |
          rm .github/workflows/_migrate-math-delimiters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/thesis/proposal/BAB_I_PENDAHULUAN.md \
                  docs/thesis/proposal/BAB_II_TINJAUAN_PUSTAKA.md \
                  docs/thesis/proposal/BAB_III_METODOLOGI_PENELITIAN.md \
                  .github/workflows/_migrate-math-delimiters.yml
          if git diff --cached --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git commit -m "Use GitHub-friendly math delimiters [skip ci]"
          git push origin HEAD:proposal/thesis-foundation
