name: DRNet Refinement CI

on:
  push:
    branches:
      - agent/drnet-dual-refinement-screening
    paths:
      - "src/coffee_detector/drnet_refinement/**"
      - "src/coffee_detector/experiments/run_faruq_v3_drnet_refinement_screening.py"
      - "tests/test_drnet_refinement.py"
      - "configs/drnet_refinement/**"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/drnet-refinement-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/drnet_refinement/**"
      - "src/coffee_detector/experiments/run_faruq_v3_drnet_refinement_screening.py"
      - "tests/test_drnet_refinement.py"
      - "configs/drnet_refinement/**"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/drnet-refinement-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          import torch
          print('torch:', torch.__version__)
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: DRNet refinement tests
        run: python -m pytest -q tests/test_drnet_refinement.py
      - name: Config and runner import smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.drnet_refinement import DRNetRefinementConfig
          from coffee_detector.experiments.run_faruq_v3_drnet_refinement_screening import CONFIGS
          for code, path in CONFIGS.items():
              payload = yaml.safe_load(Path(path).read_text())
              cfg = DRNetRefinementConfig.from_mapping(payload['drnet_refinement'])
              assert payload['code'] == code
              print(code, cfg)
          PY
