name: DRNet Interaction Verification CI

on:
  push:
    branches:
      - agent/drnet-interaction-verification-screening
    paths:
      - "src/coffee_detector/drnet_refinement/**"
      - "src/coffee_detector/experiments/run_faruq_v3_drnet_interaction_screening.py"
      - "tests/test_drnet_interaction.py"
      - "configs/drnet_refinement/DRIV1_yolo26n_entity_family_verification.yaml"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "notebooks/Faruq_V3_DRNet_Interaction_Verification_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DRNET_INTERACTION_VERIFICATION_PROTOCOL.md"
      - ".github/workflows/drnet-interaction-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/drnet_refinement/**"
      - "src/coffee_detector/experiments/run_faruq_v3_drnet_interaction_screening.py"
      - "tests/test_drnet_interaction.py"
      - "configs/drnet_refinement/DRIV1_yolo26n_entity_family_verification.yaml"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "notebooks/Faruq_V3_DRNet_Interaction_Verification_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DRNET_INTERACTION_VERIFICATION_PROTOCOL.md"
      - ".github/workflows/drnet-interaction-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drnet-interaction-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, ultralytics
          print("torch:", torch.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY
      - name: Interaction unit and inference-contract tests
        run: |
          python -m pytest -q tests/test_drnet_interaction.py
      - name: Config ontology and notebook smoke check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from coffee_detector.drnet_refinement import DRNetInteractionConfig, build_entity_family_mapping
          config_path=Path('configs/drnet_refinement/DRIV1_yolo26n_entity_family_verification.yaml')
          payload=yaml.safe_load(config_path.read_text(encoding='utf-8'))
          config=DRNetInteractionConfig.from_mapping(payload['drnet_interaction'])
          assert config.coarse_loss_weight == 1.0
          ontology=Path(payload['ontology'])
          sample=['biji_normal','kulit_kopi_ukuran_kecil','kulit_tanduk_ukuran_kecil','kopi_gelondong','tanah_batu_ranting_kecil']
          mapping,groups,members=build_entity_family_mapping(sample,ontology)
          assert len(groups)==5 and len(mapping)==5
          notebook=json.loads(Path('notebooks/Faruq_V3_DRNet_Interaction_Verification_Screening_Colab.ipynb').read_text(encoding='utf-8'))
          source='\n'.join(''.join(cell.get('source',[])) for cell in notebook['cells'])
          assert 'agent/drnet-interaction-verification-screening' in source
          assert 'run_faruq_v3_drnet_interaction_screening' in source
          assert '--authorize-training' in source
          assert 'split=test' not in source.lower()
          print(groups, members)
          PY
