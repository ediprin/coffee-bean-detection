name: GDS Classification CI

on:
  push:
    branches:
      - agent/gds-classification-aux-screening
    paths:
      - "src/coffee_detector/gds_cls/**"
      - "src/coffee_detector/experiments/run_faruq_v3_gds_cls_screening.py"
      - "configs/gds_cls/**"
      - "tests/test_gds_cls.py"
      - "notebooks/Faruq_V3_Zhao_GDS_Classification_Screening_Colab.ipynb"
      - ".github/workflows/gds-cls-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/gds_cls/**"
      - "src/coffee_detector/experiments/run_faruq_v3_gds_cls_screening.py"
      - "configs/gds_cls/**"
      - "tests/test_gds_cls.py"
      - "notebooks/Faruq_V3_Zhao_GDS_Classification_Screening_Colab.ipynb"
      - ".github/workflows/gds-cls-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import torch, ultralytics
          print('torch:', torch.__version__)
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: GDS geometry and wrapper tests
        run: python -m pytest -q tests/test_gds_cls.py
      - name: Config contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.gds_cls import GDSClsConfig
          p=Path('configs/gds_cls/GDSC1_yolo26n_grid_distance_classification.yaml')
          x=yaml.safe_load(p.read_text())
          c=GDSClsConfig.from_mapping(x['gds_cls'])
          assert x['code']=='GDSC1'
          assert c.grid_size==7 and c.threshold==0.05
          assert c.auxiliary_weight==0.25
          assert int(x['train']['epochs'])==50 and int(x['train']['imgsz'])==640
          print(c)
          PY
      - name: Compile
        run: python -m compileall -q src/coffee_detector/gds_cls src/coffee_detector/experiments/run_faruq_v3_gds_cls_screening.py
