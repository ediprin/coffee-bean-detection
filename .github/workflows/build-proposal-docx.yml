name: Build Proposal DOCX

on:
  workflow_dispatch:
    inputs:
      student_name:
        description: Nama mahasiswa (opsional)
        required: false
        default: ""
      nim:
        description: NIM / singkatan program studi (opsional)
        required: false
        default: ""
      prodi:
        description: Nama program studi (opsional)
        required: false
        default: ""
      year:
        description: Tahun pada sampul
        required: false
        default: "2026"
      document_label:
        description: Label dokumen pada sampul
        required: false
        default: "TESIS"
  push:
    branches:
      - proposal/thesis-foundation
    paths:
      - "docs/thesis/proposal/**"
      - "README.md"
      - "tools/thesis_docx/**"
      - "docs/thesis/BUILD_DOCX.md"
      - ".github/workflows/build-proposal-docx.yml"

permissions:
  contents: read

concurrency:
  group: proposal-docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THESIS_STUDENT: ${{ github.event.inputs.student_name || vars.THESIS_STUDENT || 'NAMA MAHASISWA' }}
      THESIS_NIM: ${{ github.event.inputs.nim || vars.THESIS_NIM || 'NIM / SINGKATAN PRODI' }}
      THESIS_PRODI: ${{ github.event.inputs.prodi || vars.THESIS_PRODI || 'NAMA PROGRAM STUDI' }}
      THESIS_YEAR: ${{ github.event.inputs.year || vars.THESIS_YEAR || '2026' }}
      THESIS_LABEL: ${{ github.event.inputs.document_label || vars.THESIS_LABEL || 'TESIS' }}

    steps:
      - name: Checkout proposal branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer librsvg2-bin

      - name: Install Python dependencies
        run: pip install -r tools/thesis_docx/requirements.txt

      - name: Verify formal proposal sources
        run: |
          test -f docs/thesis/proposal/BAB_I_PENDAHULUAN.md
          test -f docs/thesis/proposal/BAB_II_TINJAUAN_PUSTAKA.md
          test -f docs/thesis/proposal/BAB_III_METODOLOGI_PENELITIAN.md
          test -f docs/thesis/proposal/DAFTAR_PUSTAKA.md
          test -f docs/thesis/proposal/assets/alur_penelitian.svg
          test ! -f BAB_I_PENDAHULUAN.md
          test ! -f BAB_II_TINJAUAN_PUSTAKA.md
          test ! -f BAB_III_METODOLOGI_PENELITIAN.md

      - name: Build proposal DOCX
        run: |
          mkdir -p build
          python tools/thesis_docx/build_proposal.py \
            --repo . \
            --output build/Proposal_Tesis_USU.docx

      - name: Finalize thesis formatting
        run: |
          python tools/thesis_docx/finalize_format.py \
            build/Proposal_Tesis_USU.docx

      - name: Format Markdown figures
        run: |
          python tools/thesis_docx/format_figures.py \
            build/Proposal_Tesis_USU.docx

      # Do not rewrite BAB/title heading styles here. The visible TOC is built
      # independently so the chapter order and Word heading structure stay intact.
      - name: Prepare deterministic static table of contents
        run: |
          python tools/thesis_docx/static_toc.py prepare \
            build/Proposal_Tesis_USU.docx \
            build/Proposal_Tesis_USU.prepared.docx
          mv build/Proposal_Tesis_USU.prepared.docx build/Proposal_Tesis_USU.docx

      - name: Render pagination pass 1
        run: |
          mkdir -p build/toc-pass1
          libreoffice --headless --convert-to pdf \
            --outdir build/toc-pass1 \
            build/Proposal_Tesis_USU.docx
          test -s build/toc-pass1/Proposal_Tesis_USU.pdf

      - name: Populate static table of contents
        run: |
          python tools/thesis_docx/static_toc.py populate \
            build/Proposal_Tesis_USU.docx \
            build/toc-pass1/Proposal_Tesis_USU.pdf \
            build/Proposal_Tesis_USU.toc1.docx
          mv build/Proposal_Tesis_USU.toc1.docx build/Proposal_Tesis_USU.docx

      - name: Render pagination pass 2
        run: |
          mkdir -p build/toc-pass2
          libreoffice --headless --convert-to pdf \
            --outdir build/toc-pass2 \
            build/Proposal_Tesis_USU.docx
          test -s build/toc-pass2/Proposal_Tesis_USU.pdf

      - name: Finalize static table of contents page numbers
        run: |
          python tools/thesis_docx/static_toc.py populate \
            build/Proposal_Tesis_USU.docx \
            build/toc-pass2/Proposal_Tesis_USU.pdf \
            build/Proposal_Tesis_USU.final.docx
          mv build/Proposal_Tesis_USU.final.docx build/Proposal_Tesis_USU.docx

      - name: Structural smoke test
        run: |
          python - <<'PY'
          import re
          from docx import Document
          from docx.oxml.ns import qn
          from docx.shared import Cm

          path = "build/Proposal_Tesis_USU.docx"
          doc = Document(path)
          text = "\n".join(paragraph.text for paragraph in doc.paragraphs)

          # Required document order must remain intact.
          required_order = ["BAB I", "BAB II", "BAB III", "DAFTAR PUSTAKA"]
          positions = []
          for required in required_order:
              matches = [i for i, p in enumerate(doc.paragraphs) if p.text.strip() == required]
              assert matches, f"Missing required section: {required}"
              positions.append(matches[0])
          assert positions == sorted(positions), f"Broken chapter order: {list(zip(required_order, positions))}"

          # Keep original Word heading semantics: no chapter-style rewriting.
          chapter_pairs = {
              "BAB I": "PENDAHULUAN",
              "BAB II": "TINJAUAN PUSTAKA",
              "BAB III": "METODOLOGI PENELITIAN",
          }
          for bab, title in chapter_pairs.items():
              bi = next(i for i, p in enumerate(doc.paragraphs) if p.text.strip() == bab)
              assert doc.paragraphs[bi].style.name == "Heading 1", (bab, doc.paragraphs[bi].style.name)
              assert doc.paragraphs[bi + 1].text.strip() == title
              assert doc.paragraphs[bi + 1].style.name == "Heading 1", (title, doc.paragraphs[bi + 1].style.name)

          assert re.search(r"Gambar\s+3\.1\.?\s+Alur Penelitian", text), "Missing Gambar 3.1 caption"
          assert "Gambar 3.2" not in text, "Unexpected extra methodology figure"
          assert len(doc.sections) >= 6, f"Expected cover/front-matter/body split; got {len(doc.sections)}"
          assert len(doc.inline_shapes) == 2, f"Expected only cover logo + Gambar 3.1; got {len(doc.inline_shapes)} images"

          # The flowchart must be proportional to the text area.
          figures = list(doc.inline_shapes)
          flow = max(figures, key=lambda s: s.height)
          assert flow.width <= Cm(8.5) + 1000, f"Flowchart too wide: {flow.width / Cm(1):.2f} cm"
          assert flow.height <= Cm(13.5) + 1000, f"Flowchart too tall: {flow.height / Cm(1):.2f} cm"

          static_toc = [p for p in doc.paragraphs if p.style.name.startswith("Static TOC")]
          assert len(static_toc) >= 50, f"Static TOC is unexpectedly short: {len(static_toc)} entries"
          toc_text = "\n".join(p.text for p in static_toc)
          for chapter in (
              "BAB I PENDAHULUAN",
              "BAB II TINJAUAN PUSTAKA",
              "BAB III METODOLOGI PENELITIAN",
              "DAFTAR PUSTAKA",
          ):
              assert chapter in toc_text, f"Missing static TOC entry: {chapter}"
          assert doc.styles["Static TOC 1"].font.bold is True
          assert doc.styles["Static TOC 1"].font.name == "Times New Roman"
          assert doc.styles["Static TOC 2"].font.bold is not True

          main_toc_fields = [
              (node.text or "")
              for node in doc.element.iter(qn("w:instrText"))
              if " TOC " in (node.text or "") and "Caption" not in (node.text or "")
          ]
          assert not main_toc_fields, f"Dynamic main TOC field still present: {main_toc_fields}"

          equation_tables = 0
          regular_tables = 0
          for index, table in enumerate(doc.tables):
              has_math = bool(
                  list(table._tbl.iter(qn("m:oMath")))
                  or list(table._tbl.iter(qn("m:oMathPara")))
              )
              is_equation = (
                  len(table.rows) == 1
                  and len(table.columns) == 3
                  and has_math
                  and bool(re.fullmatch(r"\(\d+(?:\.\d+)?\)", table.cell(0, 2).text.strip()))
              )
              borders = table._tbl.tblPr.find(qn("w:tblBorders"))
              assert borders is not None, f"Table {index} has no explicit borders"
              values = []
              for edge in ("top", "left", "bottom", "right", "insideH", "insideV"):
                  element = borders.find(qn(f"w:{edge}"))
                  assert element is not None, f"Table {index} missing border {edge}"
                  values.append(element.get(qn("w:val")))
              if is_equation:
                  equation_tables += 1
                  assert set(values) <= {"nil", "none"}, f"Equation table border visible: {values}"
              else:
                  regular_tables += 1
                  assert set(values) == {"single"}, f"Regular table lacks full borders: {values}"

          math_pr = doc.settings._element.find(qn("m:mathPr"))
          assert math_pr is not None, "Missing math defaults"
          math_font = math_pr.find(qn("m:mathFont"))
          assert math_font is not None and math_font.get(qn("m:val")) == "Times New Roman"

          bad_fonts = []
          for r_fonts in doc.element.iter(qn("w:rFonts")):
              for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                  if r_fonts.get(qn(f"w:{attr}")) != "Times New Roman":
                      bad_fonts.append((attr, r_fonts.get(qn(f"w:{attr}"))))
                      break
          assert not bad_fonts, f"Non-Times New Roman font requests: {bad_fonts[:10]}"

          print(
              f"OK: chapter order preserved; {len(static_toc)} visible TOC entries, "
              f"{regular_tables} regular tables, {equation_tables} equation tables, "
              f"{len(doc.inline_shapes)} images, {len(doc.sections)} sections"
          )
          PY

      - name: Render final smoke test
        run: |
          mkdir -p build/render-smoke
          libreoffice --headless --convert-to pdf \
            --outdir build/render-smoke \
            build/Proposal_Tesis_USU.docx
          test -s build/render-smoke/Proposal_Tesis_USU.pdf

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-thesis-usu
          path: build/Proposal_Tesis_USU.docx
          if-no-files-found: error
          retention-days: 30
