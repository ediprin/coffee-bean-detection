name: Build Proposal DOCX

on:
  workflow_dispatch:
    inputs:
      student_name:
        description: Nama mahasiswa (opsional)
        required: false
        default: ""
      nim:
        description: NIM / singkatan program studi (opsional)
        required: false
        default: ""
      prodi:
        description: Nama program studi (opsional)
        required: false
        default: ""
      year:
        description: Tahun pada sampul
        required: false
        default: "2026"
      document_label:
        description: Label dokumen pada sampul
        required: false
        default: "TESIS"
  push:
    branches:
      - proposal/thesis-foundation
    paths:
      - "docs/thesis/proposal/**"
      - "README.md"
      - "tools/thesis_docx/**"
      - "docs/thesis/BUILD_DOCX.md"
      - ".github/workflows/build-proposal-docx.yml"

permissions:
  contents: read

concurrency:
  group: proposal-docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THESIS_STUDENT: ${{ github.event.inputs.student_name || vars.THESIS_STUDENT || 'NAMA MAHASISWA' }}
      THESIS_NIM: ${{ github.event.inputs.nim || vars.THESIS_NIM || 'NIM / SINGKATAN PRODI' }}
      THESIS_PRODI: ${{ github.event.inputs.prodi || vars.THESIS_PRODI || 'NAMA PROGRAM STUDI' }}
      THESIS_YEAR: ${{ github.event.inputs.year || vars.THESIS_YEAR || '2026' }}
      THESIS_LABEL: ${{ github.event.inputs.document_label || vars.THESIS_LABEL || 'TESIS' }}

    steps:
      - name: Checkout proposal branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer

      - name: Install Python dependencies
        run: pip install -r tools/thesis_docx/requirements.txt

      - name: Verify formal proposal sources
        run: |
          test -f docs/thesis/proposal/BAB_I_PENDAHULUAN.md
          test -f docs/thesis/proposal/BAB_II_TINJAUAN_PUSTAKA.md
          test -f docs/thesis/proposal/BAB_III_METODOLOGI_PENELITIAN.md
          test -f docs/thesis/proposal/DAFTAR_PUSTAKA.md

      - name: Build proposal DOCX
        run: |
          mkdir -p build
          python tools/thesis_docx/build_proposal.py \
            --repo . \
            --output build/Proposal_Tesis_USU.docx

      - name: Finalize thesis formatting
        run: |
          python tools/thesis_docx/finalize_format.py \
            build/Proposal_Tesis_USU.docx

      - name: Structural smoke test
        run: |
          python - <<'PY'
          import re
          from docx import Document
          from docx.oxml.ns import qn

          path = "build/Proposal_Tesis_USU.docx"
          doc = Document(path)
          text = "\n".join(paragraph.text for paragraph in doc.paragraphs)
          for required in ("BAB I", "BAB II", "BAB III", "DAFTAR PUSTAKA"):
              assert required in text, f"Missing required section: {required}"
          assert len(doc.sections) >= 5, f"Unexpected section count: {len(doc.sections)}"

          equation_tables = 0
          regular_tables = 0
          for index, table in enumerate(doc.tables):
              has_math = bool(
                  list(table._tbl.iter(qn("m:oMath")))
                  or list(table._tbl.iter(qn("m:oMathPara")))
              )
              is_equation = (
                  len(table.rows) == 1
                  and len(table.columns) == 3
                  and has_math
                  and bool(re.fullmatch(r"\(\d+(?:\.\d+)?\)", table.cell(0, 2).text.strip()))
              )
              borders = table._tbl.tblPr.find(qn("w:tblBorders"))
              assert borders is not None, f"Table {index} has no explicit borders"
              values = []
              for edge in ("top", "left", "bottom", "right", "insideH", "insideV"):
                  element = borders.find(qn(f"w:{edge}"))
                  assert element is not None, f"Table {index} missing border {edge}"
                  values.append(element.get(qn("w:val")))
              if is_equation:
                  equation_tables += 1
                  assert set(values) <= {"nil", "none"}, (
                      f"Equation table {index} still has a visible border: {values}"
                  )
              else:
                  regular_tables += 1
                  assert set(values) == {"single"}, (
                      f"Regular table {index} does not have full borders: {values}"
                  )

          math_pr = doc.settings._element.find(qn("m:mathPr"))
          assert math_pr is not None, "Missing math defaults"
          math_font = math_pr.find(qn("m:mathFont"))
          assert math_font is not None
          assert math_font.get(qn("m:val")) == "Times New Roman"

          bad_fonts = []
          for r_fonts in doc.element.iter(qn("w:rFonts")):
              for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                  if r_fonts.get(qn(f"w:{attr}")) != "Times New Roman":
                      bad_fonts.append((attr, r_fonts.get(qn(f"w:{attr}"))))
                      break
          assert not bad_fonts, f"Non-Times New Roman direct font requests: {bad_fonts[:10]}"

          print(
              f"OK: {len(doc.paragraphs)} paragraphs, {regular_tables} regular tables, "
              f"{equation_tables} equation tables, {len(doc.sections)} sections"
          )
          PY

      - name: Render smoke test
        run: |
          mkdir -p build/render-smoke
          libreoffice --headless --convert-to pdf \
            --outdir build/render-smoke \
            build/Proposal_Tesis_USU.docx
          test -s build/render-smoke/Proposal_Tesis_USU.pdf

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-thesis-usu
          path: build/Proposal_Tesis_USU.docx
          if-no-files-found: error
          retention-days: 30
