name: ExpertDet HierVIP CI

on:
  push:
    branches:
      - agent/expert-hiervip-screening
    paths:
      - "src/coffee_detector/hiervip/**"
      - "src/coffee_detector/experiments/run_faruq_v3_hiervip_screening.py"
      - "tests/test_hiervip.py"
      - "configs/hiervip/**"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "notebooks/Faruq_V3_ExpertDet_HierVIP_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_EXPERTDET_HIERVIP_PROTOCOL.md"
      - ".github/workflows/hiervip-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/hiervip/**"
      - "src/coffee_detector/experiments/run_faruq_v3_hiervip_screening.py"
      - "tests/test_hiervip.py"
      - "configs/hiervip/**"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "notebooks/Faruq_V3_ExpertDet_HierVIP_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_EXPERTDET_HIERVIP_PROTOCOL.md"
      - ".github/workflows/hiervip-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiervip-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, ultralytics
          print("torch:", torch.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY
      - name: HierVIP unit and inference-contract tests
        run: |
          python -m pytest -q tests/test_hiervip.py
      - name: Paper-constant ontology and notebook smoke check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from coffee_detector.hiervip import HierVIPConfig, build_sni_hierarchy
          cfg=yaml.safe_load(Path('configs/hiervip/HVIP1_yolo26n_sni_hierarchy.yaml').read_text(encoding='utf-8'))
          h=HierVIPConfig.from_mapping(cfg['hiervip'])
          assert h.temperature == 0.2
          assert h.loss_weight == 0.001
          assert h.momentum_low == 0.5 and h.momentum_base == 0.8 and h.drift_alpha == 0.2
          names=['biji_normal','biji_hitam','biji_hitam_sebagian','kulit_kopi_ukuran_kecil','kulit_tanduk_ukuran_kecil','tanah_batu_ranting_kecil']
          hierarchy=build_sni_hierarchy(names,Path(cfg['ontology']))
          assert hierarchy.gamma == (3.0,2.0,1.0,0.0)
          notebook=json.loads(Path('notebooks/Faruq_V3_ExpertDet_HierVIP_Screening_Colab.ipynb').read_text(encoding='utf-8'))
          source='\n'.join(''.join(cell.get('source',[])) for cell in notebook['cells'])
          assert 'agent/expert-hiervip-screening' in source
          assert 'run_faruq_v3_hiervip_screening' in source
          assert '--authorize-training' in source
          assert 'split=test' not in source.lower()
          print(hierarchy.to_dict())
          PY
