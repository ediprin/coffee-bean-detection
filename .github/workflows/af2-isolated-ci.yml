name: AF2 Isolated CI

on:
  push:
    branches:
      - agent/af2-isolated-radial-orientation
    paths:
      - "src/coffee_detector/af2_iso/**"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_iso_arm.py"
      - "configs/af2_iso/**"
      - "tests/test_af2_iso.py"
      - "notebooks/Faruq_V3_AF2_*_Seed42_Colab.ipynb"
      - "docs/AF2_ISOLATED_RADIAL_ORIENTATION_PROTOCOL_2026-08-21.md"
      - ".github/workflows/af2-isolated-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/af2_iso/**"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_iso_arm.py"
      - "configs/af2_iso/**"
      - "tests/test_af2_iso.py"
      - "notebooks/Faruq_V3_AF2_*_Seed42_Colab.ipynb"
      - "docs/AF2_ISOLATED_RADIAL_ORIENTATION_PROTOCOL_2026-08-21.md"
      - ".github/workflows/af2-isolated-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af2-isolated-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: AF2 isolated unit and parity tests
        run: python -m pytest -q tests/test_af2_iso.py
      - name: CLI smoke check
        run: python -m coffee_detector.experiments.run_faruq_v3_af2_iso_arm --help
      - name: Frontend smoke check
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.af2_iso import AF2IsolatedInputEnhancer, frozen_arm_config
          x = torch.rand(1, 3, 64, 64)
          for arm in ('AF2_BASE', 'AF2_RADIAL', 'AF2_ORIENT'):
              m = AF2IsolatedInputEnhancer(frozen_arm_config(arm))
              y = m(x)
              assert y.shape == x.shape
              assert torch.isfinite(y).all()
              assert not list(m.parameters())
              print(arm, 'smoke check passed')
          PY
      - name: Notebook JSON smoke check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('notebooks/Faruq_V3_AF2_RADIAL_Seed42_Colab.ipynb'),
              Path('notebooks/Faruq_V3_AF2_ORIENT_Seed42_Colab.ipynb'),
          ):
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload['nbformat'] == 4
              assert payload['cells']
              print(path, 'valid')
          PY
