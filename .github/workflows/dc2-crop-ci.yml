name: DC2 Raw Crop CI

on:
  push:
    branches:
      - agent/dc2-raw-crop-screening
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_crop_screening.py"
      - "tests/test_dc2_crop.py"
      - ".github/workflows/dc2-crop-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_crop_screening.py"
      - "tests/test_dc2_crop.py"
      - ".github/workflows/dc2-crop-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc2-crop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: DC2 raw-crop unit tests
        run: |
          python -m pytest -q tests/test_dc2_crop.py

      - name: Import smoke check
        run: |
          python - <<'PY'
          from coffee_detector.experiments.run_faruq_v3_dc2_crop_screening import RESOLUTIONS
          assert RESOLUTIONS == (32, 64, 128, 224)
          print("DC2 crop resolutions:", RESOLUTIONS)
          PY
