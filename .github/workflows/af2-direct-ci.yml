name: AF2 Direct From Pretrained CI

on:
  push:
    branches:
      - codex/af2-direct-from-pretrained
    paths:
      - "src/coffee_detector/afab/**"
      - "src/coffee_detector/analysis/faruq_v3_diagnostics.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_direct.py"
      - "configs/afab/AF2_yolo26n_chaotic_amplitude.yaml"
      - "configs/coffee_fg/D0_yolo26n_p3.yaml"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - "tests/test_afab.py"
      - "tests/test_af2_direct_protocol.py"
      - "notebooks/Faruq_V3_AF2_Direct_From_Pretrained_Seed42_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_DIRECT_FROM_PRETRAINED_PROTOCOL_2026-08-24.md"
      - ".github/workflows/af2-direct-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/afab/**"
      - "src/coffee_detector/analysis/faruq_v3_diagnostics.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_direct.py"
      - "configs/afab/AF2_yolo26n_chaotic_amplitude.yaml"
      - "configs/coffee_fg/D0_yolo26n_p3.yaml"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - "tests/test_afab.py"
      - "tests/test_af2_direct_protocol.py"
      - "notebooks/Faruq_V3_AF2_Direct_From_Pretrained_Seed42_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_DIRECT_FROM_PRETRAINED_PROTOCOL_2026-08-24.md"
      - ".github/workflows/af2-direct-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af2-direct-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime version
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: AF2 direct unit and protocol tests
        run: python -m pytest -q tests/test_afab.py tests/test_af2_direct_protocol.py
      - name: Runner CLI smoke check
        run: python -m coffee_detector.experiments.run_faruq_v3_af2_direct --help
      - name: Official-pretrained static match smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO
          from coffee_detector.experiments.run_faruq_v3_af2_direct import run_direct_static_preflight

          YOLO('yolo26n.pt')
          weights = Path('yolo26n.pt').resolve()
          assert weights.is_file(), weights
          report = run_direct_static_preflight(weights, Path('af2_direct_static_ci.json'), seed=42)
          assert report['decision'] == 'PASS'
          assert report['gates']['detector_state_tensors_exact'] is True
          assert report['af2_learned_parameter_count'] == 0
          print('pretrained sha256:', report['pretrained_checkpoint_sha256'])
          print('common init sha256:', report['common_initialized_detector_state_sha256'])
          PY
