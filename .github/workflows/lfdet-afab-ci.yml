name: LFDet AFAB CI

on:
  push:
    branches:
      - agent/lfdet-afab-frequency-input-screening
    paths:
      - "src/coffee_detector/afab/**"
      - "src/coffee_detector/experiments/run_faruq_v3_afab_screening.py"
      - "configs/afab/**"
      - "tests/test_afab.py"
      - "notebooks/Faruq_V3_LFDet_AFAB_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_LFDET_AFAB_PROTOCOL.md"
      - ".github/workflows/lfdet-afab-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/afab/**"
      - "src/coffee_detector/experiments/run_faruq_v3_afab_screening.py"
      - "configs/afab/**"
      - "tests/test_afab.py"
      - "notebooks/Faruq_V3_LFDet_AFAB_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_LFDET_AFAB_PROTOCOL.md"
      - ".github/workflows/lfdet-afab-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfdet-afab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY
      - name: AFAB unit and protocol tests
        run: |
          python -m pytest -q tests/test_afab.py
      - name: AFAB 640 patch-count and finite smoke check
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.afab import AFABConfig, AFABInputEnhancer
          cfg = AFABConfig(mode="af1", patch_size=32, overlap=0.50, chunk_size=64)
          module = AFABInputEnhancer(cfg).eval()
          assert cfg.stride == 16
          x = torch.rand(1, 3, 640, 640)
          with torch.inference_mode():
              y = module(x)
          assert y.shape == x.shape
          assert torch.isfinite(y).all()
          assert ((640 - 32) // 16 + 1) ** 2 == 1521
          print("AFAB 640 smoke check passed; patches=1521")
          PY
