name: DC2 Integrated Inference CI

on:
  push:
    branches:
      - agent/dc2-integrated-inference-screening
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_integrated_inference.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "tests/test_dc2_msfa.py"
      - "tests/test_dc2_integrated.py"
      - "notebooks/Faruq_V3_DC2_Integrated_Inference_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_INTEGRATED_INFERENCE_PROTOCOL.md"
      - ".github/workflows/dc2-integrated-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_integrated_inference.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "tests/test_dc2_msfa.py"
      - "tests/test_dc2_integrated.py"
      - "notebooks/Faruq_V3_DC2_Integrated_Inference_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_INTEGRATED_INFERENCE_PROTOCOL.md"
      - ".github/workflows/dc2-integrated-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc2-integrated-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: DC2 integrated unit and protocol tests
        run: |
          python -m pytest -q \
            tests/test_dc2_crop.py \
            tests/test_dc2_predicted_crop.py \
            tests/test_dc2_msfa.py \
            tests/test_dc2_integrated.py

      - name: Detection-level AP smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          from coffee_detector.dc2_crop.integrated import GroundTruthRecord, IntegratedPredictionRecord, detection_map_summary
          image = Path('/tmp/a.jpg')
          prediction = IntegratedPredictionRecord(image, (0.0, 0.0, 10.0, 10.0), 0, 0.9)
          target = GroundTruthRecord(image, 0, (0.0, 0.0, 10.0, 10.0))
          result = detection_map_summary([prediction], [target], 1)
          assert abs(result['map50_95'] - 1.0) < 1e-9
          print('paired AP evaluator smoke check passed')
          PY
