name: Build Thesis Proposal DOCX

on:
  push:
    branches:
      - proposal/thesis-foundation
    paths:
      - 'docs/thesis/**'
      - 'tools/thesis/**'
      - '.github/workflows/build-thesis-proposal.yml'
  workflow_dispatch:

jobs:
  build-proposal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice librsvg2-bin
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Build QA-hardened working proposal DOCX
        run: |
          mkdir -p build/thesis
          python tools/thesis/build_proposal_docx_v2.py \
            --repo . \
            --out build/thesis/Proposal_AF2_USU_Working.docx \
            --emit-markdown build/thesis/Proposal_AF2_USU_Working.md

      - name: Render proposal figures
        run: |
          mkdir -p build/thesis/figures
          for f in docs/thesis/figures/fig_3_*.svg; do
            name="$(basename "$f" .svg)"
            rsvg-convert -w 1600 "$f" -o "build/thesis/figures/${name}.png"
          done

      - name: Insert Figures 3.1–3.4 into DOCX
        run: |
          python tools/thesis/insert_proposal_figures.py \
            --docx build/thesis/Proposal_AF2_USU_Working.docx \
            --image-dir build/thesis/figures

      - name: Apply chapter-based equation numbering
        run: |
          python tools/thesis/apply_equation_numbers.py \
            --docx build/thesis/Proposal_AF2_USU_Working.docx

      - name: Apply SPs section-aware pagination
        run: |
          python tools/thesis/apply_sps_pagination.py \
            --docx build/thesis/Proposal_AF2_USU_Working.docx

      - name: Isolate related-work table in landscape
        run: |
          python tools/thesis/apply_landscape_tables.py \
            --docx build/thesis/Proposal_AF2_USU_Working.docx

      - name: Render PDF for layout inspection
        run: |
          mkdir -p build/thesis/rendered
          libreoffice --headless \
            --convert-to pdf \
            --outdir build/thesis/rendered \
            build/thesis/Proposal_AF2_USU_Working.docx

      - name: Upload proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-proposal-working
          path: |
            build/thesis/Proposal_AF2_USU_Working.docx
            build/thesis/Proposal_AF2_USU_Working.md
            build/thesis/rendered/Proposal_AF2_USU_Working.pdf
          if-no-files-found: error
          retention-days: 30
