name: Breadth Screening Batch CI

on:
  push:
    branches:
      - agent/breadth-screening-batch-v1
    paths:
      - "configs/breadth_screening/**"
      - "src/coffee_detector/drive_project.py"
      - "tools/run_faruq_v3_breadth_batch.py"
      - "tools/preflight_faruq_v3_breadth_batch.py"
      - "tests/test_breadth_screening_batch.py"
      - "notebooks/Faruq_V3_Breadth_Screening_Batch_V1_Colab.ipynb"
      - "docs/FARUQ_V3_BREADTH_SCREENING_BATCH_V1.md"
      - ".github/workflows/breadth-screening-batch-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "configs/breadth_screening/**"
      - "src/coffee_detector/drive_project.py"
      - "tools/run_faruq_v3_breadth_batch.py"
      - "tools/preflight_faruq_v3_breadth_batch.py"
      - "tests/test_breadth_screening_batch.py"
      - "notebooks/Faruq_V3_Breadth_Screening_Batch_V1_Colab.ipynb"
      - "docs/FARUQ_V3_BREADTH_SCREENING_BATCH_V1.md"
      - ".github/workflows/breadth-screening-batch-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breadth-screening-batch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: Drive resolver import smoke check
        run: |
          python - <<'PY'
          from coffee_detector.drive_project import require_project_artifact, resolve_drive_project_root
          assert callable(require_project_artifact)
          assert callable(resolve_drive_project_root)
          print('drive_project import passed')
          PY
      - name: Batch manifest and controller tests
        run: |
          python -m pytest -q tests/test_breadth_screening_batch.py
      - name: Controller CLI smoke check
        run: |
          python tools/run_faruq_v3_breadth_batch.py --help
      - name: Preflight all 22 frozen candidate runners
        run: |
          cp tools/run_faruq_v3_breadth_batch.py /tmp/run_faruq_v3_breadth_batch.py
          cp tools/preflight_faruq_v3_breadth_batch.py /tmp/preflight_faruq_v3_breadth_batch.py
          cp configs/breadth_screening/faruq_v3_batch_v1.json /tmp/faruq_v3_batch_v1.json
          python /tmp/preflight_faruq_v3_breadth_batch.py \
            --repo "$GITHUB_WORKSPACE" \
            --manifest /tmp/faruq_v3_batch_v1.json
      - name: Frozen manifest summary
        run: |
          git checkout --detach "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('configs/breadth_screening/faruq_v3_batch_v1.json').read_text())
          enabled = [x for x in p['candidates'] if x.get('enabled') and x.get('group') == 'detector']
          assert len(enabled) == 22
          print('protocol:', p['protocol'])
          print('enabled:', len(enabled))
          print('ids:', ', '.join(x['id'] for x in enabled))
          print('gate:', p['canonical_gate'])
          PY
