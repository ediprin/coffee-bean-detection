name: DC2 MSFA CI

on:
  push:
    branches:
      - agent/dc2-msfa-screening
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_msfa_screening.py"
      - "tests/test_dc2_msfa.py"
      - "notebooks/Faruq_V3_DC2_MSFA_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_MSFA_PROTOCOL.md"
      - ".github/workflows/dc2-msfa-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_msfa_screening.py"
      - "tests/test_dc2_msfa.py"
      - "notebooks/Faruq_V3_DC2_MSFA_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_MSFA_PROTOCOL.md"
      - ".github/workflows/dc2-msfa-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc2-msfa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: DC2 MSFA unit and protocol tests
        run: |
          python -m pytest -q tests/test_dc2_predicted_crop.py tests/test_dc2_msfa.py

      - name: Frozen gate smoke check
        run: |
          python - <<'PY'
          from coffee_detector.experiments.run_faruq_v3_dc2_msfa_screening import decide_dc2_msfa
          result = decide_dc2_msfa(
              train_coverage=0.95,
              val_coverage=0.95,
              replay_metrics={"macro_f1": 0.82, "bottom3_f1": 0.70, "worst_f1": 0.62},
              dc2b_metrics={"macro_f1": 0.82, "bottom3_f1": 0.70, "worst_f1": 0.62},
              msfa_metrics={"macro_f1": 0.827, "bottom3_f1": 0.699, "worst_f1": 0.615},
              global_feature_std=0.2,
          )
          assert result["decision"] == "PASS"
          assert result["next_action"] == "AUTHORIZE_DC2_END_TO_END_INTEGRATION_SCREENING"
          print(result["criteria"])
          PY
