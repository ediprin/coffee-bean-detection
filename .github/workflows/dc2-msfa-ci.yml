name: DC2 MSFA Global Local CI

on:
  push:
    branches:
      - agent/dc2-msfa-global-local-screening
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_msfa_screening.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "tests/test_dc2_msfa.py"
      - "notebooks/Faruq_V3_DC2_MSFA_Global_Local_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_MSFA_GLOBAL_LOCAL_PROTOCOL.md"
      - ".github/workflows/dc2-msfa-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_msfa_screening.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "tests/test_dc2_msfa.py"
      - "notebooks/Faruq_V3_DC2_MSFA_Global_Local_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_MSFA_GLOBAL_LOCAL_PROTOCOL.md"
      - ".github/workflows/dc2-msfa-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc2-msfa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: DC2 MSFA unit and protocol tests
        run: |
          python -m pytest -q tests/test_dc2_crop.py tests/test_dc2_predicted_crop.py tests/test_dc2_msfa.py

      - name: MSFA zero-preservation smoke check
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.dc2_crop.msfa import DC2MSFAClassifier
          model = DC2MSFAClassifier(21, global_dim=13, imagenet_pretrained=False).eval()
          image = torch.randn(1, 3, 64, 64)
          global_descriptor = torch.randn(1, 13)
          with torch.inference_mode():
              local = model(image, global_descriptor, enable_global=False)
              fused = model(image, global_descriptor, enable_global=True)
          assert torch.equal(local, fused)
          print("zero-init MSFA preserves local logits")
          PY
