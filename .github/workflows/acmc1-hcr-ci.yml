name: ACMC1 HCR CI

on:
  push:
    branches:
      - agent/acmc1-hard-competitor-ranking
    paths:
      - "src/coffee_detector/ambiguity_multilevel/ranking.py"
      - "src/coffee_detector/experiments/run_faruq_v3_acmc1h_screening.py"
      - "configs/ambiguity_multilevel/ACMC1H_yolo26n_hard_competitor.yaml"
      - "tests/test_acmc1_hard_competitor_ranking.py"
      - "tests/test_ambiguity_multilevel.py"
      - "notebooks/Faruq_V3_ACMC1_Hard_Competitor_Screening_Colab.ipynb"
      - ".github/workflows/acmc1-hcr-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/ambiguity_multilevel/ranking.py"
      - "src/coffee_detector/experiments/run_faruq_v3_acmc1h_screening.py"
      - "configs/ambiguity_multilevel/ACMC1H_yolo26n_hard_competitor.yaml"
      - "tests/test_acmc1_hard_competitor_ranking.py"
      - "tests/test_ambiguity_multilevel.py"
      - "notebooks/Faruq_V3_ACMC1_Hard_Competitor_Screening_Colab.ipynb"
      - ".github/workflows/acmc1-hcr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acmc1-hcr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify pinned runtime
        run: |
          python - <<'PY'
          import ultralytics
          assert ultralytics.__version__ == "8.4.96", ultralytics.__version__
          print("ultralytics", ultralytics.__version__)
          PY
      - name: HCR tests
        run: python -m pytest -q tests/test_acmc1_hard_competitor_ranking.py tests/test_ambiguity_multilevel.py
      - name: Frozen config smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.ambiguity_multilevel.ranking import HardCompetitorRankingConfig
          p = Path('configs/ambiguity_multilevel/ACMC1H_yolo26n_hard_competitor.yaml')
          cfg = yaml.safe_load(p.read_text())
          h = HardCompetitorRankingConfig.from_mapping(cfg['hard_competitor_ranking'])
          assert h.weight == 0.25
          assert h.branch == 'one2one_only'
          assert h.competitor == 'strongest_wrong_class'
          assert h.loss == 'softplus_pairwise'
          print(h)
          PY
