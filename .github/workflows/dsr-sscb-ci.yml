name: DSR SSCB CI

on:
  push:
    branches:
      - agent/dsr-sscb-msda-screening
    paths:
      - "src/coffee_detector/dsr_sscb/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dsr_sscb_screening.py"
      - "configs/dsr_sscb/**"
      - "tests/test_dsr_sscb.py"
      - "notebooks/Faruq_V3_DSR_SSCB_MSDA_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DSR_SSCB_MSDA_PROTOCOL.md"
      - ".github/workflows/dsr-sscb-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dsr_sscb/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dsr_sscb_screening.py"
      - "configs/dsr_sscb/**"
      - "tests/test_dsr_sscb.py"
      - "notebooks/Faruq_V3_DSR_SSCB_MSDA_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DSR_SSCB_MSDA_PROTOCOL.md"
      - ".github/workflows/dsr-sscb-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsr-sscb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: SSCB tests
        run: python -m pytest -q tests/test_dsr_sscb.py
      - name: Training criterion smoke check
        run: |
          python - <<'PY'
          import json
          import traceback
          import torch
          from pathlib import Path
          from ultralytics.cfg import get_cfg
          from coffee_detector.dsr_sscb import SSCBConfig, SSCBDetectionModel
          try:
              root = Path('.')
              model = SSCBDetectionModel(
                  str(root/'configs/coffee_fg/models/yolo26n-p3.yaml'),
                  nc=3,
                  verbose=False,
                  sscb=SSCBConfig(mode='calibrated', hidden_dim=16, sampling_points=2),
              ).train()
              # Ultralytics DetectionTrainer attaches resolved training args before
              # criterion construction. Mirror that runtime contract explicitly
              # instead of calling init_criterion() on a bare model.
              model.args = get_cfg()
              output = model(torch.randn(2,3,128,128))
              assert 'sscb_semantic_logits' in output['one2many']
              assert 'sscb_semantic_logits' not in output['one2one']
              criterion = model.init_criterion()
              assert criterion is not None
              notebook = root/'notebooks/Faruq_V3_DSR_SSCB_MSDA_Screening_Colab.ipynb'
              if notebook.is_file():
                  payload = json.loads(notebook.read_text(encoding='utf-8'))
                  assert payload['nbformat'] == 4
              assert (root/'docs/FARUQ_V3_DSR_SSCB_MSDA_PROTOCOL.md').is_file()
              print(type(criterion).__name__)
              print('DSR SSCB smoke check passed')
          except Exception:
              text = traceback.format_exc()
              Path('sscb_criterion_traceback.txt').write_text(text, encoding='utf-8')
              print(text)
              raise
          PY
      - name: Upload criterion traceback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sscb-criterion-traceback
          path: sscb_criterion_traceback.txt
          if-no-files-found: ignore
