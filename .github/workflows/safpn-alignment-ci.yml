name: SAFPN Alignment CI

on:
  push:
    branches:
      - agent/safpn-classification-alignment
    paths:
      - "src/coffee_detector/safpn_alignment/**"
      - "src/coffee_detector/experiments/run_faruq_v3_safpn_screening.py"
      - "tests/test_safpn_alignment.py"
      - "configs/safpn_alignment/**"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/safpn-alignment-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/safpn_alignment/**"
      - "src/coffee_detector/experiments/run_faruq_v3_safpn_screening.py"
      - "tests/test_safpn_alignment.py"
      - "configs/safpn_alignment/**"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/safpn-alignment-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safpn-alignment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch
          import ultralytics
          print("torch:", torch.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: SAFPN alignment unit and preservation tests
        run: |
          python -m pytest -q tests/test_safpn_alignment.py

      - name: Config and screening import smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.safpn_alignment import SAFPNAlignmentConfig
          from coffee_detector.experiments.run_faruq_v3_safpn_screening import CONFIG

          path = Path("configs/safpn_alignment/SAF1_yolo26n_classification_alignment.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert payload["variant"] == "safpn_alignment"
          config = SAFPNAlignmentConfig.from_mapping(payload["safpn_alignment"])
          assert config.correction_scale == 1.0
          assert config.offset_init_zero is True
          assert CONFIG.resolve() == path.resolve()
          print("SAF1 config:", config)
          PY
