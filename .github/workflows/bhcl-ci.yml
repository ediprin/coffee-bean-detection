name: HCL BHCL Hierarchical Contrastive CI

on:
  push:
    branches:
      - agent/bhcl-hierarchical-contrastive-screening
    paths:
      - "src/coffee_detector/bhcl/**"
      - "src/coffee_detector/experiments/run_faruq_v3_bhcl_screening.py"
      - "src/coffee_detector/experiments/run_faruq_v3_hcl_bhcl_screening.py"
      - "src/coffee_detector/sni21_ontology.py"
      - "configs/bhcl/**"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "tests/test_bhcl.py"
      - "tests/test_hcl_control.py"
      - "notebooks/Faruq_V3_BHCL_Screening_Colab.ipynb"
      - "notebooks/Faruq_V3_HCL_BHCL_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_BHCL_PROTOCOL.md"
      - "docs/FARUQ_V3_HCL_BHCL_ABLATION_PROTOCOL.md"
      - ".github/workflows/bhcl-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/bhcl/**"
      - "src/coffee_detector/experiments/run_faruq_v3_bhcl_screening.py"
      - "src/coffee_detector/experiments/run_faruq_v3_hcl_bhcl_screening.py"
      - "src/coffee_detector/sni21_ontology.py"
      - "configs/bhcl/**"
      - "configs/sni21/structured_ontology_v1.yaml"
      - "tests/test_bhcl.py"
      - "tests/test_hcl_control.py"
      - "notebooks/Faruq_V3_BHCL_Screening_Colab.ipynb"
      - "notebooks/Faruq_V3_HCL_BHCL_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_BHCL_PROTOCOL.md"
      - "docs/FARUQ_V3_HCL_BHCL_ABLATION_PROTOCOL.md"
      - ".github/workflows/bhcl-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bhcl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY
      - name: HCL and BHCL hierarchy loss and model contracts
        run: |
          python -m pytest -q tests/test_bhcl.py tests/test_hcl_control.py
      - name: HCL and BHCL gradient smoke checks
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.bhcl import (
              BHCLConfig,
              BalancedHierarchyPrototypeBank,
              balanced_hierarchical_contrastive_loss,
              hierarchical_contrastive_loss,
          )
          labels = torch.tensor([0, 0, 1, 1, 12, 12, 15, 15])
          for variant, fn in (("hcl", hierarchical_contrastive_loss), ("bhcl", balanced_hierarchical_contrastive_loss)):
              cfg = BHCLConfig(embedding_dim=16, temperature=0.1, loss_weight=0.6, epsilon=0.1, anchor_chunk_size=4, variant=variant)
              bank = BalancedHierarchyPrototypeBank(cfg)
              z = torch.randn(8, 16, requires_grad=True)
              loss = fn(z, labels, bank, cfg)
              assert torch.isfinite(loss)
              loss.backward()
              assert z.grad is not None and torch.isfinite(z.grad).all()
              print(variant, float(loss.detach()))
          PY
