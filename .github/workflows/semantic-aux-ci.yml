name: Semantic Aux CI
on:
  push:
    branches: [agent/leaf-preserving-semantic-screening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_semantic_aux.py
      - run: python -c "from coffee_detector.experiments.run_faruq_v3_semantic_aux_screening import CONFIG; print(CONFIG)"
