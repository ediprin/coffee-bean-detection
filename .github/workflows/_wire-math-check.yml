name: One-time wire proposal math check
on:
  push:
    branches: [proposal/thesis-foundation]
    paths: [.github/workflows/_wire-math-check.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/thesis-foundation
      - name: Insert permanent math source check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-proposal-docx.yml')
          s=p.read_text()
          step='''      - name: Verify GitHub-safe math source\n        run: python tools/thesis_docx/check_math_source.py\n\n'''
          needle='      - name: Build proposal DOCX\n'
          if step not in s:
              if needle not in s:
                  raise SystemExit('Build step anchor not found')
              s=s.replace(needle, step+needle, 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-proposal-docx.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Enforce GitHub-safe proposal math source'
            git push origin HEAD:proposal/thesis-foundation
          fi
      - name: Remove one-time workflow
        run: |
          git pull --rebase origin proposal/thesis-foundation
          git rm .github/workflows/_wire-math-check.yml
          git commit -m 'Remove one-time math check wiring [skip ci]'
          git push origin HEAD:proposal/thesis-foundation
