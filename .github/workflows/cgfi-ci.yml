name: CGFI CI

on:
  push:
    branches:
      - agent/lfdet-cgfi-frequency-screening
    paths:
      - "src/coffee_detector/cgfi/**"
      - "src/coffee_detector/experiments/run_faruq_v3_cgfi_screening.py"
      - "configs/cgfi/**"
      - "tests/test_cgfi.py"
      - "notebooks/Faruq_V3_LFDet_CGFI_Screening_Colab.ipynb"
      - ".github/workflows/cgfi-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/cgfi/**"
      - "src/coffee_detector/experiments/run_faruq_v3_cgfi_screening.py"
      - "configs/cgfi/**"
      - "tests/test_cgfi.py"
      - "notebooks/Faruq_V3_LFDet_CGFI_Screening_Colab.ipynb"
      - ".github/workflows/cgfi-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics, torch
          print('torch:', torch.__version__)
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: CGFI tests
        run: python -m pytest -q tests/test_cgfi.py
      - name: Config contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.cgfi import CGFIConfig
          p=Path('configs/cgfi/CG1_yolo26n_frequency_classification.yaml')
          x=yaml.safe_load(p.read_text())
          c=CGFIConfig.from_mapping(x['cgfi'])
          assert x['code']=='CG1'
          assert c.hidden_ratio==0.25
          assert c.fusion_raw_weight==0.5 and c.fusion_frequency_weight==0.5
          assert int(x['train']['epochs'])==50
          assert int(x['train']['imgsz'])==640
          print(c)
          PY
      - name: Compile
        run: python -m compileall -q src/coffee_detector/cgfi src/coffee_detector/experiments/run_faruq_v3_cgfi_screening.py
