name: AF2 Refinement CI

on:
  push:
    branches:
      - agent/af2-rad-wavelet-refinement
    paths:
      - "src/coffee_detector/af2_refinement/**"
      - "src/coffee_detector/experiments/prepare_af2_refinement_kaggle.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_refinement_arm.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_refinement_decision.py"
      - "configs/af2_refinement/**"
      - "tests/test_af2_refinement.py"
      - "notebooks/Faruq_V3_AF2_RAD_Wavelet_Refinement_Sequential_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_RAD_WAVELET_REFINEMENT_PROTOCOL.md"
      - ".github/workflows/af2-refinement-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/af2_refinement/**"
      - "src/coffee_detector/experiments/prepare_af2_refinement_kaggle.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_refinement_arm.py"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_refinement_decision.py"
      - "configs/af2_refinement/**"
      - "tests/test_af2_refinement.py"
      - "notebooks/Faruq_V3_AF2_RAD_Wavelet_Refinement_Sequential_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_RAD_WAVELET_REFINEMENT_PROTOCOL.md"
      - ".github/workflows/af2-refinement-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af2-refinement-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: AF2 refinement unit and protocol tests
        run: python -m pytest -q tests/test_af2_refinement.py
      - name: Runner CLI smoke checks
        run: |
          python -m coffee_detector.experiments.run_faruq_v3_af2_refinement_arm --help
          python -m coffee_detector.experiments.run_faruq_v3_af2_refinement_decision --help
      - name: Frontend CPU smoke check
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.af2_refinement import TRAIN_ARMS, AF2RefinementInputEnhancer, frozen_refinement_config
          x=torch.rand(1,3,64,64,requires_grad=True)
          for arm in TRAIN_ARMS:
              f=AF2RefinementInputEnhancer(frozen_refinement_config(arm))
              y=f(x)
              assert y.shape == x.shape and torch.isfinite(y).all()
          print('AF2 refinement frontend smoke passed')
          PY
