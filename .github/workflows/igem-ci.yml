name: IGEM CI

on:
  push:
    branches:
      - agent/igem-classification-guidance-screening
    paths:
      - "src/coffee_detector/igem/**"
      - "src/coffee_detector/experiments/run_faruq_v3_igem_screening.py"
      - "configs/igem/**"
      - "tests/test_igem.py"
      - "notebooks/Faruq_V3_IGEM_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_IGEM_SCREENING_PROTOCOL.md"
      - ".github/workflows/igem-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/igem/**"
      - "src/coffee_detector/experiments/run_faruq_v3_igem_screening.py"
      - "configs/igem/**"
      - "tests/test_igem.py"
      - "notebooks/Faruq_V3_IGEM_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_IGEM_SCREENING_PROTOCOL.md"
      - ".github/workflows/igem-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igem-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: IGEM unit and protocol tests
        run: python -m pytest -q tests/test_igem.py
      - name: Runner CLI smoke check
        run: python -m coffee_detector.experiments.run_faruq_v3_igem_screening --help
      - name: IGEM model smoke check
        run: |
          python - <<'PY'
          import torch
          from pathlib import Path
          from coffee_detector.igem import IGEMConfig, IGEMDetectionModel
          model = IGEMDetectionModel(
              str(Path('configs/coffee_fg/models/yolo26n-p3.yaml')),
              nc=3,
              verbose=False,
              igem=IGEMConfig(),
          ).train()
          out = model(torch.randn(2,3,128,128))
          assert 'igem_mask_logits' in out['one2many']
          assert 'igem_mask_logits' not in out['one2one']
          assert len(out['one2many']['igem_mask_logits']) == 3
          print('IGEM smoke check passed')
          PY
