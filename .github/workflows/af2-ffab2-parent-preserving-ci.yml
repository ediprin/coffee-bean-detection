name: AF2 FFAB2 Parent-Preserving CI

on:
  push:
    branches:
      - codex/af2-ffab2-parent-preserving
    paths:
      - "src/coffee_detector/af2_ffa/**"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_ffab2_parent_*.py"
      - "configs/af2_ffa_parent_preserving/**"
      - "tests/test_af2_ffab2_parent_preserving.py"
      - "notebooks/Faruq_V3_AF2_FFAB2_Parent_Preserving_All_Seeds_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_FFAB2_PARENT_PRESERVING_PROTOCOL_2026-08-24.md"
      - ".github/workflows/af2-ffab2-parent-preserving-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/af2_ffa/**"
      - "src/coffee_detector/experiments/run_faruq_v3_af2_ffab2_parent_*.py"
      - "configs/af2_ffa_parent_preserving/**"
      - "tests/test_af2_ffab2_parent_preserving.py"
      - "notebooks/Faruq_V3_AF2_FFAB2_Parent_Preserving_All_Seeds_Kaggle.ipynb"
      - "docs/FARUQ_V3_AF2_FFAB2_PARENT_PRESERVING_PROTOCOL_2026-08-24.md"
      - ".github/workflows/af2-ffab2-parent-preserving-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af2-ffab2-parent-preserving-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-contract-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime version
        run: |
          python - <<'PY'
          import ultralytics
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: Parent-preserving regression tests
        run: |
          python -m pytest -q \
            tests/test_af2_ffa.py \
            tests/test_af2_ffab2_parent_preserving.py
      - name: CLI smoke checks
        run: |
          python -m coffee_detector.experiments.run_faruq_v3_af2_ffab2_parent_arm --help
          python -m coffee_detector.experiments.run_faruq_v3_af2_ffab2_parent_decision --help
      - name: Config invariants
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          root=Path('configs/af2_ffa_parent_preserving')
          paths=sorted(root.glob('AF2FFAPR*.yaml'))
          assert len(paths)==2
          data=[yaml.safe_load(p.read_text()) for p in paths]
          by={x['code']:x for x in data}
          assert set(by)=={'AF2FFAPR0','AF2FFAPR1'}
          assert by['AF2FFAPR0']['af2_ffa']['conditioning']=='zero'
          assert by['AF2FFAPR1']['af2_ffa']['conditioning']=='spectral'
          assert all(x['af2_ffa']['fusion_mode']=='parent_residual' for x in data)
          assert all(x['train']['epochs']==30 for x in data)
          print('parent-preserving config smoke check passed')
          PY
      - name: Notebook JSON smoke check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('notebooks/Faruq_V3_AF2_FFAB2_Parent_Preserving_All_Seeds_Kaggle.ipynb')
          payload=json.loads(path.read_text(encoding='utf-8'))
          assert payload['nbformat']==4 and payload['cells']
          source='\n'.join(''.join(cell.get('source',[])) for cell in payload['cells'])
          assert "BRANCH='codex/af2-ffab2-parent-preserving'" in source
          assert 'AF2FFAPR1' in source
          assert 'run_faruq_v3_af2_ffab2_parent_decision' in source
          assert '/kaggle/input' in source and '/kaggle/working' in source
          assert 'google.colab' not in source
          assert 'split=test' not in source.lower()
          print(path,'valid')
          PY
