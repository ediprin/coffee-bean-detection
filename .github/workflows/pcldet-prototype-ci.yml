name: PCLDet Prototype CI

on:
  push:
    branches:
      - agent/pcldet-prototype-baseline-screening
    paths:
      - "src/coffee_detector/pcl/**"
      - "src/coffee_detector/experiments/run_faruq_v3_pcl_screening.py"
      - "tests/test_pcl.py"
      - "configs/pcl/**"
      - "notebooks/Faruq_V3_PCLDet_Prototype_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_PCLDET_PROTOTYPE_PROTOCOL.md"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/pcldet-prototype-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/pcl/**"
      - "src/coffee_detector/experiments/run_faruq_v3_pcl_screening.py"
      - "tests/test_pcl.py"
      - "configs/pcl/**"
      - "notebooks/Faruq_V3_PCLDet_Prototype_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_PCLDET_PROTOTYPE_PROTOCOL.md"
      - "configs/coffee_fg/models/yolo26n-p3.yaml"
      - ".github/workflows/pcldet-prototype-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcldet-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch
          import ultralytics
          print("torch:", torch.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: PCLDet unit and inference-contract tests
        run: |
          python -m pytest -q tests/test_pcl.py

      - name: Config paper-parameter and screening import smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          from coffee_detector.pcl import PCLConfig
          from coffee_detector.experiments.run_faruq_v3_pcl_screening import CONFIG

          path = Path("configs/pcl/PCL1_yolo26n_learned_prototype.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert payload["variant"] == "pcl"
          config = PCLConfig.from_mapping(payload["pcl"])
          assert config.embedding_dim == 128
          assert config.temperature == 1.0 / 32.0
          assert config.loss_weight == 1.0
          assert config.prototype_init_std == 1.0
          assert CONFIG.resolve() == path.resolve()
          notebook = json.loads(Path("notebooks/Faruq_V3_PCLDet_Prototype_Screening_Colab.ipynb").read_text(encoding="utf-8"))
          source = "\n".join("".join(cell.get("source", [])) for cell in notebook["cells"])
          assert "agent/pcldet-prototype-baseline-screening" in source
          assert "run_faruq_v3_pcl_screening" in source
          assert "--authorize-training" in source
          assert "split=test" not in source.lower()
          print("PCL1 config:", config)
          PY
