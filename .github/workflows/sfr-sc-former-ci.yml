name: SFR SC-Former CI

on:
  push:
    branches:
      - agent/sfrnet-sc-former-screening
    paths:
      - "src/coffee_detector/sfr_sc/**"
      - "src/coffee_detector/sfr_spatial/**"
      - "src/coffee_detector/experiments/run_faruq_v3_sfr_sc_screening.py"
      - "configs/sfr_sc/**"
      - "tests/test_sfr_sc.py"
      - "tests/test_sfr_spatial.py"
      - "notebooks/Faruq_V3_SFR_SC_Former_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_SFR_SC_FORMER_PROTOCOL.md"
      - ".github/workflows/sfr-sc-former-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/sfr_sc/**"
      - "src/coffee_detector/sfr_spatial/**"
      - "src/coffee_detector/experiments/run_faruq_v3_sfr_sc_screening.py"
      - "configs/sfr_sc/**"
      - "tests/test_sfr_sc.py"
      - "tests/test_sfr_spatial.py"
      - "notebooks/Faruq_V3_SFR_SC_Former_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_SFR_SC_FORMER_PROTOCOL.md"
      - ".github/workflows/sfr-sc-former-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfr-sc-former-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: SFR spatial and SC-Former tests
        run: |
          python -m pytest -q tests/test_sfr_spatial.py tests/test_sfr_sc.py

      - name: LSH contract smoke check
        run: |
          python - <<'PY'
          import torch
          from coffee_detector.sfr_sc import SFRSCConfig, WindowChannelLSHFormer
          block = WindowChannelLSHFormer(8, SFRSCConfig(hidden_dim=16, hash_buckets=4))
          value = torch.randn(2, 8, 13, 17)
          output = block(value)
          assert output.shape == (2, 16, 13, 17)
          assert torch.isfinite(output).all()
          assert block.hash_projection.shape == (49, 2)
          print("SC-Former LSH smoke check passed")
          PY
