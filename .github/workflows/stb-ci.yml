name: STB CI

on:
  push:
    branches:
      - agent/gds-stb-classification-screening
    paths:
      - "src/coffee_detector/stb/**"
      - "src/coffee_detector/experiments/run_faruq_v3_stb_screening.py"
      - "configs/stb/**"
      - "tests/test_stb.py"
      - "notebooks/Faruq_V3_Zhao_STB_Screening_Colab.ipynb"
      - ".github/workflows/stb-ci.yml"
  pull_request:
    paths:
      - "src/coffee_detector/stb/**"
      - "src/coffee_detector/experiments/run_faruq_v3_stb_screening.py"
      - "configs/stb/**"
      - "tests/test_stb.py"
      - "notebooks/Faruq_V3_Zhao_STB_Screening_Colab.ipynb"
      - ".github/workflows/stb-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print('torch:', torch.__version__)
          print('torchvision:', torchvision.__version__)
          print('ultralytics:', ultralytics.__version__)
          assert ultralytics.__version__ == '8.4.96'
          PY
      - name: STB operator tests
        run: python -m pytest -q tests/test_stb.py
      - name: Config contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from coffee_detector.stb import STBConfig
          p=Path('configs/stb/STB1_yolo26n_swin_classification.yaml')
          x=yaml.safe_load(p.read_text())
          c=STBConfig.from_mapping(x['stb'])
          assert x['code']=='STB1'
          assert c.window_size==4 and c.num_heads==4
          assert c.mlp_ratio==4.0
          assert int(x['train']['epochs'])==50 and int(x['train']['imgsz'])==640
          print(c)
          PY
      - name: Compile
        run: python -m compileall -q src/coffee_detector/stb src/coffee_detector/experiments/run_faruq_v3_stb_screening.py
