name: DC2 Predicted Raw Crop CI

on:
  push:
    branches:
      - agent/dc2-predicted-raw-crop-screening
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_predicted_crop_screening.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "notebooks/Faruq_V3_DC2_Predicted_Raw_Crop_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_PREDICTED_RAW_CROP_PROTOCOL.md"
      - ".github/workflows/dc2-predicted-crop-ci.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/coffee_detector/dc2_crop/**"
      - "src/coffee_detector/experiments/run_faruq_v3_dc2_predicted_crop_screening.py"
      - "tests/test_dc2_crop.py"
      - "tests/test_dc2_predicted_crop.py"
      - "notebooks/Faruq_V3_DC2_Predicted_Raw_Crop_Screening_Colab.ipynb"
      - "docs/FARUQ_V3_DC2_PREDICTED_RAW_CROP_PROTOCOL.md"
      - ".github/workflows/dc2-predicted-crop-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc2-predicted-crop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show pinned runtime versions
        run: |
          python - <<'PY'
          import torch, torchvision, ultralytics
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("ultralytics:", ultralytics.__version__)
          assert ultralytics.__version__ == "8.4.96"
          PY

      - name: DC2 crop unit and protocol tests
        run: |
          python -m pytest -q tests/test_dc2_crop.py tests/test_dc2_predicted_crop.py

      - name: Decision-gate smoke check
        run: |
          python - <<'PY'
          from coffee_detector.experiments.run_faruq_v3_dc2_predicted_crop_screening import decide_dc2_predicted
          result = decide_dc2_predicted(
              train_coverage=0.95,
              val_coverage=0.95,
              detector_metrics={"macro_f1": 0.80, "bottom3_f1": 0.60, "worst_f1": 0.50},
              predicted_metrics={"macro_f1": 0.83, "bottom3_f1": 0.62, "worst_f1": 0.49},
              gt_matched_metrics={"macro_f1": 0.86, "bottom3_f1": 0.70, "worst_f1": 0.60},
          )
          assert result["decision"] == "PASS"
          assert result["next_action"] == "AUTHORIZE_DC2_GLOBAL_LOCAL_MSFA_SCREENING"
          print(result["criteria"])
          PY
