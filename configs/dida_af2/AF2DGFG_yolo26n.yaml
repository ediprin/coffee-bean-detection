code: AF2DGFG
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
dida:
  mode: dgfg
  dg_gain: 0.10
  fg_gain: 0.05
  temperature: 2.0
  margin: 0.20
  topk: 3
  brightness: 0.08
  contrast_low: 0.90
  contrast_high: 1.10
  gamma_low: 0.90
  gamma_high: 1.10
  channel_gain_low: 0.97
  channel_gain_high: 1.03
  eps: 1.0e-8
train:
  epochs: 50
  imgsz: 640
  batch: 8
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500

