code: DLRBC_FRESH
variant: dense_low_rank_bilinear_residual
model: configs/coffee_fg/models/yolo26n-p3.yaml
weights: official_yolo26n_sha_locked
dlrbc:
  mode: quadratic
  rank: 8
  projection_ratio: 0.5
  minimum_projection: 16
  residual_scale: 0.1
  signed_sqrt: true
  eps: 0.000001
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
