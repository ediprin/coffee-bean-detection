code: FRM1
variant: frozen_residual
model: configs/coffee_fg/models/yolo26n-p3.yaml
weights: yolo26n.pt
frozen_residual:
  descriptor_dim: 512
  roi_size: 3
  topk: 500
  training_topk: 500
  inference_weight: 1.0
  box_expand: 1.0
  positive_iou: 0.5
  preservation_weight: 0.25
  gate_init_probability: 0.01
train:
  epochs: 10
  imgsz: 640
  batch: 16
  workers: 2
  patience: 10
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0001
  pretrained: false
  cache: false
  mosaic: 0.0
  close_mosaic: 0
  max_det: 500
