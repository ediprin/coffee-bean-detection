code: AF2R1
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
af2r:
  conditioning: illumination
  hidden_channels: 8
  local_kernel: 15
  eps: 1.0e-6
train:
  epochs: 30
  imgsz: 640
  batch: 16
  workers: 2
  patience: 10
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
