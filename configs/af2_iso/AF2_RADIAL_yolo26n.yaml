code: AF2_RADIAL
model: configs/coffee_fg/models/yolo26n-p3.yaml
af2_iso:
  arm: AF2_RADIAL
  patch_size: 32
  overlap: 0.50
  gamma: 0.10
  angular_bins: 360
  orientation_period: 360.0
  radial_boundaries: [0.3333333333333333, 0.6666666666666666]
  chunk_size: 128
  eps: 1.0e-8
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
  save_period: 1
