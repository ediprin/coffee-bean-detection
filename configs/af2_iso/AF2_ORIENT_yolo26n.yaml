code: AF2_ORIENT
model: configs/coffee_fg/models/yolo26n-p3.yaml
af2_iso:
  arm: AF2_ORIENT
  patch_size: 32
  overlap: 0.50
  gamma: 0.10
  angular_bins: 180
  orientation_period: 180.0
  radial_boundaries: []
  chunk_size: 128
  eps: 1.0e-8
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
  save_period: 1
