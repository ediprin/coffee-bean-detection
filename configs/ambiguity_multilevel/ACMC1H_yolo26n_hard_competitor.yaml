code: ACMC1H
variant: ambiguity_multilevel_ranking
model: configs/coffee_fg/models/yolo26n-p3.yaml
ambiguity_multilevel:
  hidden_dim: 64
  context_kernel: 3
  correction_scale: 1.0
  ambiguity_floor: 0.0
  ambiguity_mode: entropy
hard_competitor_ranking:
  weight: 0.25
  branch: one2one_only
  competitor: strongest_wrong_class
  loss: softplus_pairwise
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
