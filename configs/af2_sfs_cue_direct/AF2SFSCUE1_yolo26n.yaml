code: AF2SFSCUE1
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
sfs_cue:
  code: AF2SFSCUE1
  feature_level: 0
  lowpass_kernel: 3
  decoder_channels: 3
  auxiliary_gain: 0.10
  signal_mix: 0.50
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
