code: SG1
model: configs/coffee_fg/models/yolo26n-p3.yaml
semantic_guided:
  tasks:
    - entity_family
    - primary_condition
    - hole_count
    - integrity_fraction
    - surface_extent
  auxiliary_weight: 0.20
  correction_scale: 1.0
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
