code: AF2RCC0
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab: &af2
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
af2_rcc:
  conditioning: zero
  gain_cap: 0.10
  cue_channels: 3
  expected_levels: 3
  max_added_parameters: 256
train: &schedule
  epochs: 20
  imgsz: 640
  batch: 16
  workers: 2
  patience: 7
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
