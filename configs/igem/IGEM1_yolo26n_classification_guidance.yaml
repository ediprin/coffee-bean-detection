code: IGEM1
model: configs/coffee_fg/models/yolo26n-p3.yaml
igem:
  reference_depth: 3
  mask_loss_weight: 0.05
  kernel_size: 3
  attention_heads: 4
  channel_reduction: 4
  correction_scale: 1.0
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
