code: AF2DECAY1
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
spds:
  arm: AF2DECAY1
  target: af2_signal
  auxiliary_gain: 0.10
  decoder_channels: 3
  auxiliary_schedule: cosine_last10
train:
  epochs: 30
  imgsz: 640
  batch: 16
  workers: 2
  patience: 10
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
