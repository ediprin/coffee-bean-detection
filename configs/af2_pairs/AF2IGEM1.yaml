code: AF2IGEM1
standalone: IGEM1
model: configs/coffee_fg/models/yolo26n-p3.yaml
af2:
  mode: af2
  patch_size: 32
  overlap: 0.5
  radius_ratio: 0.05
  gamma: 0.1
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
strong:
  reference_depth: 3
  mask_loss_weight: 0.05
  kernel_size: 3
  attention_heads: 4
  channel_reduction: 4
  correction_scale: 1.0
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
