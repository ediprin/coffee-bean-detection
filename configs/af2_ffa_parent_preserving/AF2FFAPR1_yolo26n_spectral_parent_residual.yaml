code: AF2FFAPR1
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
af2_ffa:
  conditioning: spectral
  descriptor_type: rfft_ratio
  radial_cutoff: 0.35
  eps: 1.0e-6
  max_added_fraction: 0.01
  residual_gain_cap: 0.10
  gradient_matched_cap: true
  adapter_strength_scale: 1.0
  active_levels: [true, true, true]
  fusion_mode: parent_residual
  residual_mix: 1.0
  ambiguity_gate: none
  ambiguity_margin: 0.15
  ambiguity_temperature: 0.05
train:
  epochs: 30
  imgsz: 640
  batch: 16
  workers: 2
  patience: 10
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
