code: AF2CURR1
model: configs/coffee_fg/models/yolo26n-p3.yaml
afab:
  mode: af2
  patch_size: 32
  overlap: 0.50
  radius_ratio: 0.05
  gamma: 0.10
  angular_bins: 360
  chunk_size: 128
  eps: 1.0e-8
curriculum:
  code: AF2CURR1
  feature_level: 0
  lowpass_kernel: 3
  auxiliary_gain: 0.10
  warmup_epochs: 5
  ramp_epochs: 10
  hold_epochs: 5
  decay_epochs: 10
  gradient_alignment: true
train:
  epochs: 30
  imgsz: 640
  batch: 16
  workers: 2
  patience: 10
  optimizer: auto
  pretrained: false
  cache: false
  close_mosaic: 10
  max_det: 500
