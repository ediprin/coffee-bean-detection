code: SGC0
model: configs/coffee_fg/models/yolo26n-p3.yaml
source: STB1
sgfr:
  stage: control
  window_size: 4
  num_heads: 4
  mlp_ratio: 4.0
  reference_depth: 3
  mask_loss_weight: 0.05
  kernel_size: 3
  attention_heads: 4
  channel_reduction: 4
  frequency_hidden: 32
  af2_patch_size: 32
  af2_overlap: 0.50
  af2_radius_ratio: 0.05
  af2_gamma: 0.10
train:
  epochs: 20
  imgsz: 640
  batch: 16
  workers: 2
  patience: 8
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0005
  cos_lr: true
  pretrained: false
  cache: false
  close_mosaic: 5
  max_det: 500
  compile: false

