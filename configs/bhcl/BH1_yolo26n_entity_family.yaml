code: BH1
model: configs/coffee_fg/models/yolo26n-p3.yaml
bhcl:
  embedding_dim: 128
  temperature: 0.10
  loss_weight: 0.60
  epsilon: 0.10
  anchor_chunk_size: 256
  variant: bhcl
hierarchy:
