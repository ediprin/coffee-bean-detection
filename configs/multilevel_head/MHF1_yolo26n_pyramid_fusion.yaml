code: MHF1
variant: multilevel_head
model: configs/coffee_fg/models/yolo26n-p3.yaml
weights: yolo26n.pt
multilevel_head:
  mode: pyramid_fusion
  descriptor_dim: 512
  roi_size: 3
  topk: 500
  training_topk: 500
  auxiliary_weight: 0.5
  inference_weight: 0.5
  box_expand: 1.0
  candidate_source: one2one
  positive_iou: 0.5
  predicted_start_epoch: 10
  predicted_full_epoch: 25
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
