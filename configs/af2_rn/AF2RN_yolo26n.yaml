code: AF2RN
model: configs/coffee_fg/models/yolo26n-p3.yaml
af2rn:
  patch_size: 32
  overlap: 0.50
  gamma: 0.10
  angular_bins: 360
  annulus_width: 1.0
  chunk_size: 128
  eps: 1.0e-8
train:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 2
  patience: 15
  optimizer: auto
  pretrained: true
  cache: false
  close_mosaic: 10
  max_det: 500
