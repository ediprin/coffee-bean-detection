code: S2_WAVL1_STB1_CROSSKD
model: configs/coffee_fg/models/yolo26n-p3.yaml
factorization:
  arm: WAV_L1
  eps: 1.0e-8
stb_guided:
  mode: crosskd
  temperature: 2.0
  distillation_weight: 0.50
  minimum_teacher_gt_probability: 0.10
train:
